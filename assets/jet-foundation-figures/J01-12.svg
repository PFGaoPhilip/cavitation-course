" text-anchor="start">direction follows the pressure-gradient force</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">U_c: inertial speed scale [m/s]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">U_jet: maximum pre-opposite-wall-impact speed</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">V_impact: cavity volume at jet impact</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">V_impact is not the liquid-jet volume</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Fit: incompressible potential-flow jet regime</text></g></svg>