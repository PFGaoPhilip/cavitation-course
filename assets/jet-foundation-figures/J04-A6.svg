<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Original mechanical inputs and compared outputs</title><desc id="desc">Source must supply finite pressure/volume history; Spatial geometry determines jet flow Q_j; Track actual liquid mass and arrival velocity; Hold receiver/observer definitions for comparison; Laser energy is not automatically E_B</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Original mechanical inputs and compared outputs</text><rect x="60" y="157" width="139" height="118" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="129" y="193" font-size="17" fill="#dfeaf1" text-anchor="middle">given source</text><text x="129" y="237" font-size="15" fill="#dfeaf1" text-anchor="middle">p(t), Π, E_B</text><path d="M200,215 L212,215" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><rect x="215" y="157" width="139" height="118" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="284" y="193" font-size="17" fill="#dfeaf1" text-anchor="middle">liquid jet</text><text x="284" y="237" font-size="15" fill="#dfeaf1" text-anchor="middle">Γ, φ, Q_j, u</text><path d="M355,215 L367,215" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><rect x="370" y="157" width="139" height="118" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="439" y="193" font-size="17" fill="#dfeaf1" text-anchor="middle">receiver</text><text x="439" y="237" font-size="15" fill="#dfeaf1" text-anchor="middle">A_r, g, p_obs</text><text x="65" y="333" font-size="18" fill="#dfeaf1" text-anchor="start">formation → flight → impact</text><text x="65" y="377" font-size="16" fill="#dfeaf1" text-anchor="start">state and finite budgets passed between stages</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">Source must supply finite pressure/volume history</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">Spatial geometry determines jet flow Q_j</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Track actual liquid mass and arrival velocity</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">Hold receiver/observer definitions for comparison</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Laser energy is not automatically E_B</text></g></svg>