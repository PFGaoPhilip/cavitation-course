<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Fixed-area, causal pressure observation</title><desc id="desc">A_r: fixed spatial footprint [m²]; g(s): causal temporal averaging kernel [1/s]; p_obs: observed pressure [Pa]; s: time lag, not instability growth rate; A box kernel has support 0 ≤ s ≤ τ_g</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Fixed-area, causal pressure observation</text><path d="M70,275 L475,275" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M70,275 L70,96" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M70 275 L112 275 L112 100 L135 100 L135 226 L425 226 L425 275 L470 275" fill="none" stroke="#8ad9e6" stroke-width="3"/><rect x="100" y="84" width="92" height="200" fill="#f0c78c" opacity=".12"/><text x="140" y="114" font-size="18" fill="#dfeaf1" text-anchor="start">p_h</text><text x="250" y="214" font-size="18" fill="#dfeaf1" text-anchor="start">p_tail</text><text x="102" y="308" font-size="16" fill="#dfeaf1" text-anchor="start">τ_h</text><text x="351" y="308" font-size="16" fill="#dfeaf1" text-anchor="start">τ_pass</text><text x="83" y="90" font-size="18" fill="#dfeaf1" text-anchor="start">p(t)</text><text x="474" y="297" font-size="17" fill="#dfeaf1" text-anchor="start">t</text><text x="80" y="355" font-size="16" fill="#dfeaf1" text-anchor="start">fixed footprint A_r; causal kernel g; window τ_g</text><text x="80" y="383" font-size="16" fill="#dfeaf1" text-anchor="start">peak, average and ∫p dt are different outputs</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">A_r: fixed spatial footprint [m²]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">g(s): causal temporal averaging kernel [1/s]</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">p_obs: observed pressure [Pa]</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">s: time lag, not instability growth rate</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">A box kernel has support 0 ≤ s ≤ τ_g</text></g></svg>