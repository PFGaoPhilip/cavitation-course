<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Residual terms behind the pressure-impulse approximation</title><desc id="desc">L: local flow-variation length [m]; U: local velocity scale [m/s]; τ: forcing interval [s]; ν: kinematic viscosity [m²/s]; Residual estimates are not error guarantees</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Residual terms behind the pressure-impulse approximation</text><path d="M65,270 L475,270" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M65,270 L65,95" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M65 270 L130 270 L130 135 L340 135 L340 270 L450 270" fill="none" stroke="#8ad9e6" stroke-width="3"/><rect x="130" y="135" width="210" height="135" fill="#8ad9e6" opacity=".13"/><text x="82" y="90" font-size="18" fill="#dfeaf1" text-anchor="start">p′(t)</text><text x="455" y="298" font-size="18" fill="#dfeaf1" text-anchor="start">t</text><text x="211" y="124" font-size="18" fill="#dfeaf1" text-anchor="start">Δp</text><text x="230" y="306" font-size="18" fill="#dfeaf1" text-anchor="middle">τ</text><text x="170" y="217" font-size="18" fill="#dfeaf1" text-anchor="start">area Π = ∫p′ dt</text><path d="M70,345 L455,345" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="80" y="335" font-size="16" fill="#dfeaf1" text-anchor="start">z = 0, Π₀</text><text x="370" y="335" font-size="16" fill="#dfeaf1" text-anchor="start">z = L, Π = 0</text><text x="91" y="381" font-size="17" fill="#dfeaf1" text-anchor="start">liquid ρ; −∂zΠ drives Δu along +z</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">L: local flow-variation length [m]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">U: local velocity scale [m/s]</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">τ: forcing interval [s]</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">ν: kinematic viscosity [m²/s]</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Residual estimates are not error guarantees</text></g></svg>