<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Mass and volume flux in a slender liquid jet</title><desc id="desc">z: axial position [m]; h: local radius [m]; u: section-averaged axial speed [m/s]; A: local area [m²]; Q: volume flux [m³/s]; m_j: liquid mass in the chosen segment [kg]; Ends supply or remove flux when open</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Mass and volume flux in a slender liquid jet</text><path d="M65 150 Q155 155 200 171 Q260 205 320 166 Q400 145 475 162 M65 290 Q155 285 200 269 Q260 235 320 274 Q400 295 475 278" fill="none" stroke="#8ad9e6" stroke-width="3"/><path d="M60,220 L485,220" stroke="#8ad9e6" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/><path d="M140,220 L140,159" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="150" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">h(z,t)</text><path d="M180,218 L243,218" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="170" y="244" font-size="17" fill="#dfeaf1" text-anchor="start">u(z,t)</text><path d="M300,105 L370,105" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="303" y="92" font-size="18" fill="#dfeaf1" text-anchor="start">+z</text><path d="M265,181 L280,139" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="285" y="135" font-size="17" fill="#dfeaf1" text-anchor="start">n, κ</text><text x="55" y="332" font-size="17" fill="#dfeaf1" text-anchor="start">inlet flux πh²u → segment → outlet flux</text><text x="55" y="369" font-size="17" fill="#dfeaf1" text-anchor="start">ρ, μ in liquid; σ on surface; gas p_g outside</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">z: axial position [m]; h: local radius [m]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">u: section-averaged axial speed [m/s]</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">A: local area [m²]; Q: volume flux [m³/s]</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">m_j: liquid mass in the chosen segment [kg]</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Ends supply or remove flux when open</text></g></svg>