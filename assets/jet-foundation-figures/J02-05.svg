<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Spherical reduction verifies the dynamic sign</title><desc id="desc">φ(r,t) decays to zero at infinity; φ_Γ is evaluated at r = R(t); Dφ_Γ/Dt follows the surface; Cavity normal gives κ = −2/R; Viscosity omitted consistently here</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Spherical reduction verifies the dynamic sign</text><circle cx="265" cy="215" r="76" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><text x="265" y="210" font-size="18" fill="#dfeaf1" text-anchor="middle">cavity: p_b</text><text x="265" y="235" font-size="18" fill="#dfeaf1" text-anchor="middle">V, R</text><path d="M265,215 L335,215" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="290" y="203" font-size="18" fill="#dfeaf1" text-anchor="start">R</text><path d="M375,215 L462,215" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="390" y="197" font-size="18" fill="#dfeaf1" text-anchor="start">u_r(r), Ṙ</text><path d="M265,310 L425,310" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="340" y="337" font-size="16" fill="#dfeaf1" text-anchor="middle">r from center</text><text x="70" y="110" font-size="18" fill="#dfeaf1" text-anchor="start">surrounding liquid: ρ, p_∞</text><text x="65" y="370" font-size="17" fill="#dfeaf1" text-anchor="start">pressure work → liquid kinetic energy</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">φ(r,t) decays to zero at infinity</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">φ_Γ is evaluated at r = R(t)</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Dφ_Γ/Dt follows the surface</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">Cavity normal gives κ = −2/R</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Viscosity omitted consistently here</text></g></svg>