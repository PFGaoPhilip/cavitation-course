<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Original linear threshold and flight formulas</title><desc id="desc">ε₀/a = 0.01; ε_crit/a = 0.1; Use fastest inviscid mode; H/U = 5 μs; Do not extrapolate a linear neck to pinch-off</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Original linear threshold and flight formulas</text><path d="M65,285 L478,285" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M65,285 L65,102" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M65 285 C155 280 220 230 280 115" fill="none" stroke="#8ad9e6" stroke-width="3"/><path d="M65,165 L460,165" stroke="#8ad9e6" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/><text x="320" y="156" font-size="16" fill="#dfeaf1" text-anchor="start">ε_crit = 0.1a</text><text x="82" y="278" font-size="18" fill="#dfeaf1" text-anchor="start">ε₀</text><text x="66" y="91" font-size="18" fill="#dfeaf1" text-anchor="start">ε(t)</text><text x="471" y="310" font-size="18" fill="#dfeaf1" text-anchor="start">t</text><path d="M77,353 L445,353" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="110" y="343" font-size="17" fill="#dfeaf1" text-anchor="start">jet → receiver: flight H/U</text><text x="110" y="382" font-size="17" fill="#dfeaf1" text-anchor="start">growth rate s; initial noise ε₀; radius a</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">ε₀/a = 0.01</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">ε_crit/a = 0.1</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Use fastest inviscid mode</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">H/U = 5 μs</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Do not extrapolate a linear neck to pinch-off</text></g></svg>