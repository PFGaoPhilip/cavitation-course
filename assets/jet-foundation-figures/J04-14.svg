<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Specified Newtonian stress and conductive closure</title><desc id="desc">μ ≥ 0: shear viscosity [Pa s]; μ_b ≥ 0: bulk viscosity [Pa s]; k_T ≥ 0: conductivity [W/(m K)]; T: temperature provided by thermal EOS; Body forces absent in this first control; All coefficients must be declared</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Specified Newtonian stress and conductive closure</text><rect x="160" y="150" width="190" height="144" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><text x="255" y="199" font-size="19" fill="#dfeaf1" text-anchor="middle">ρ, u, p, e, E</text><text x="255" y="240" font-size="18" fill="#dfeaf1" text-anchor="middle">liquid cell</text><path d="M75,214 L152,214" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M355,214 L450,214" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="55" y="145" font-size="17" fill="#dfeaf1" text-anchor="start">face fluxes</text><text x="365" y="145" font-size="17" fill="#dfeaf1" text-anchor="start">face fluxes</text><path d="M252,149 L252,94" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="265" y="116" font-size="18" fill="#dfeaf1" text-anchor="start">n</text><text x="65" y="337" font-size="17" fill="#dfeaf1" text-anchor="start">mass ρu; momentum ρuu + pI − τ_v</text><text x="65" y="376" font-size="17" fill="#dfeaf1" text-anchor="start">energy (ρE+p)u − τ_v u + q</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">μ ≥ 0: shear viscosity [Pa s]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">μ_b ≥ 0: bulk viscosity [Pa s]</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">k_T ≥ 0: conductivity [W/(m K)]</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">T: temperature provided by thermal EOS</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Body forces absent in this first control</text><text x="560" y="287" font-size="17" fill="#dfeaf1" text-anchor="start">All coefficients must be declared</text></g></svg>