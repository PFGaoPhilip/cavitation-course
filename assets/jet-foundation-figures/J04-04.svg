<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Finite capture impulse and the passage-time check</title><desc id="desc">J_r: delivered receiver impulse [N s]; No other axial force/input in this control; P_out,z = 0 for lateral redirection; τ_pass: finite length divided by speed; Do not keep an early peak for this whole time</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Finite capture impulse and the passage-time check</text><rect x="75" y="172" width="240" height="72" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><rect x="403" y="105" width="30" height="245" fill="#455669"/><path d="M140,207 L260,207" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="165" y="192" font-size="18" fill="#dfeaf1" text-anchor="start">U, m_j</text><path d="M85,285 L310,285" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><text x="195" y="313" font-size="17" fill="#dfeaf1" text-anchor="middle">length ℓ_j</text><text x="75" y="153" font-size="17" fill="#dfeaf1" text-anchor="start">A_j = πa²</text><text x="442" y="142" font-size="17" fill="#dfeaf1" text-anchor="start">receiver</text><text x="441" y="174" font-size="17" fill="#dfeaf1" text-anchor="start">A_r, V_s</text><path d="M390,206 L367,147" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M390,216 L367,276" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="305" y="113" font-size="16" fill="#dfeaf1" text-anchor="start">lateral outflow</text><text x="75" y="378" font-size="17" fill="#dfeaf1" text-anchor="start">momentum flux, contact force and finite impulse</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">J_r: delivered receiver impulse [N s]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">No other axial force/input in this control</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">P_out,z = 0 for lateral redirection</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">τ_pass: finite length divided by speed</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Do not keep an early peak for this whole time</text></g></svg>