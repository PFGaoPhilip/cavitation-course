<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Original synthetic traction and box-average formulas</title><desc id="desc">p_h = 30 MPa; τ_h = 1 ns; τ_pass = 15 μs; τ_g = 20 ns; Pressure uniform over A_j by prescription; History is synthetic, not impact simulation; Its area-time integral matches m_jU</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Original synthetic traction and box-average formulas</text><path d="M70,275 L475,275" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M70,275 L70,96" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M70 275 L112 275 L112 100 L135 100 L135 226 L425 226 L425 275 L470 275" fill="none" stroke="#8ad9e6" stroke-width="3"/><rect x="100" y="84" width="92" height="200" fill="#f0c78c" opacity=".12"/><text x="140" y="114" font-size="18" fill="#dfeaf1" text-anchor="start">p_h</text><text x="250" y="214" font-size="18" fill="#dfeaf1" text-anchor="start">p_tail</text><text x="102" y="308" font-size="16" fill="#dfeaf1" text-anchor="start">τ_h</text><text x="351" y="308" font-size="16" fill="#dfeaf1" text-anchor="start">τ_pass</text><text x="83" y="90" font-size="18" fill="#dfeaf1" text-anchor="start">p(t)</text><text x="474" y="297" font-size="17" fill="#dfeaf1" text-anchor="start">t</text><text x="80" y="355" font-size="16" fill="#dfeaf1" text-anchor="start">fixed footprint A_r; causal kernel g; window τ_g</text><text x="80" y="383" font-size="16" fill="#dfeaf1" text-anchor="start">peak, average and ∫p dt are different outputs</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">p_h = 30 MPa; τ_h = 1 ns</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">τ_pass = 15 μs; τ_g = 20 ns</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Pressure uniform over A_j by prescription</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">History is synthetic, not impact simulation</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Its area-time integral matches m_jU</text></g></svg>