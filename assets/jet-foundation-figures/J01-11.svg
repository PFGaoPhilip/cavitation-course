<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Planar boundary image limits and the stand-off ratio</title><desc id="desc">h: plane-to-cavity-center distance [m]; n_wall points plane → cavity center; γ: center stand-off / maximum radius; Rigid limit: jet tendency toward plane; Pressure-release limit: tendency away</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Planar boundary image limits and the stand-off ratio</text><circle cx="265" cy="215" r="76" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><text x="265" y="210" font-size="18" fill="#dfeaf1" text-anchor="middle">cavity: p_b</text><text x="265" y="235" font-size="18" fill="#dfeaf1" text-anchor="middle">V, R</text><path d="M265,215 L335,215" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="290" y="203" font-size="18" fill="#dfeaf1" text-anchor="start">R</text><rect x="58" y="98" width="23" height="262" fill="#455669"/><path d="M85,328 L265,328" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><path d="M85,322 L85,334" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><path d="M265,322 L265,334" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><text x="170" y="354" font-size="16" fill="#dfeaf1" text-anchor="middle">h: wall → center</text><path d="M150,115 L215,115" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="132" y="102" font-size="18" fill="#dfeaf1" text-anchor="start">n_wall</text><path d="M207,215 L133,215" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="86" y="260" font-size="16" fill="#dfeaf1" text-anchor="start">rigid: toward</text><text x="100" y="375" font-size="17" fill="#dfeaf1" text-anchor="start">pressure release reverses the ideal image sign</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">h: plane-to-cavity-center distance [m]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">n_wall points plane → cavity center</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">γ: center stand-off / maximum radius</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">Rigid limit: jet tendency toward plane</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Pressure-release limit: tendency away</text></g></svg>