<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Corner speed concentration with finite energy per depth</title><desc id="desc">b_⊥: out-of-plane depth [m]; K_l/b_⊥ has units J/m; Velocity is an initial increment, not final jet speed; λ &gt; 0 makes total kinetic energy finite; Rounded vertex and motion regularize the ideal limit</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Corner speed concentration with finite energy per depth</text><path d="M185 300 L385 300 A200 200 0 0 0 85 126.795 Z" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><path d="M185,300 L450,300" stroke="#f0c78c" stroke-width="2.2" fill="none"/><text x="265" y="330" font-size="16" fill="#dfeaf1" text-anchor="start">θ = 0: rigid, ∂θΠ = 0</text><text x="50" y="112" font-size="16" fill="#dfeaf1" text-anchor="start">θ = α: Π = 0</text><text x="319" y="129" font-size="16" fill="#dfeaf1" text-anchor="start">r = L: prescribed Π</text><path d="M185,300 L284,157" stroke="#8ad9e6" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/><text x="250" y="217" font-size="17" fill="#dfeaf1" text-anchor="start">r, θ</text><path d="M305,230 L249,269" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="307" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Δu</text><text x="137" y="358" font-size="17" fill="#dfeaf1" text-anchor="start">vertex r → 0</text><text x="65" y="391" font-size="17" fill="#dfeaf1" text-anchor="start">liquid sector angle α; λ = π/(2α)</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">b_⊥: out-of-plane depth [m]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">K_l/b_⊥ has units J/m</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Velocity is an initial increment, not final jet</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">speed</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">λ &gt; 0 makes total kinetic energy finite</text><text x="560" y="287" font-size="17" fill="#dfeaf1" text-anchor="start">Rounded vertex and motion regularize the ideal</text><text x="560" y="317" font-size="17" fill="#dfeaf1" text-anchor="start">limit</text></g></svg>