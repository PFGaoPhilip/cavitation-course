<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Leading directional cancellation between two distant planes</title><desc id="desc">+z points from left plane to right plane; h_L, h_R: center distances [m]; Use the leading weak-image approximation; Equal distances retain higher shape effects; Do not insert ζ = 0 into the speed fit</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Leading directional cancellation between two distant planes</text><rect x="65" y="110" width="20" height="230" fill="#455669"/><rect x="447" y="110" width="20" height="230" fill="#455669"/><circle cx="265" cy="205" r="60" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><path d="M265,205 L207,205" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M265,225 L323,225" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="185" y="173" font-size="17" fill="#dfeaf1" text-anchor="start">I_L</text><text x="318" y="267" font-size="17" fill="#dfeaf1" text-anchor="start">I_R</text><path d="M85,323 L265,323" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><path d="M265,323 L447,323" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><text x="162" y="352" font-size="18" fill="#dfeaf1" text-anchor="start">h_L</text><text x="356" y="352" font-size="18" fill="#dfeaf1" text-anchor="start">h_R</text><text x="95" y="95" font-size="17" fill="#dfeaf1" text-anchor="start">left rigid plane</text><text x="341" y="95" font-size="17" fill="#dfeaf1" text-anchor="start">right rigid plane</text><text x="68" y="391" font-size="16" fill="#dfeaf1" text-anchor="start">equal dipoles cancel; shape anisotropy can remain</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">+z points from left plane to right plane</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">h_L, h_R: center distances [m]</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Use the leading weak-image approximation</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">Equal distances retain higher shape effects</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Do not insert ζ = 0 into the speed fit</text></g></svg>