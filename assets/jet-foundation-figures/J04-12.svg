<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">A stated stiffened-gas verification closure</title><desc id="desc">Γ_l &gt; 1: reference thermodynamic exponent; p_*: stiffening pressure [Pa]; c_v: specified constant heat capacity [J/(kg K)]; p₀, ρ₀, c₀: consistent reference state; p is absolute in this EOS; Not a calibrated neat-PFC property law</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">A stated stiffened-gas verification closure</text><rect x="65" y="143" width="180" height="147" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="155" y="128" font-size="18" fill="#dfeaf1" text-anchor="middle">reference state</text><rect x="320" y="143" width="180" height="147" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="410" y="128" font-size="18" fill="#dfeaf1" text-anchor="middle">compressed state</text><text x="92" y="185" font-size="18" fill="#dfeaf1" text-anchor="start">ρ₀, p₀, T₀, e₀</text><text x="92" y="232" font-size="18" fill="#dfeaf1" text-anchor="start">c₀, Γ_l, p_*</text><text x="345" y="185" font-size="18" fill="#dfeaf1" text-anchor="start">ρ₁, p₁, T₁, e₁</text><text x="345" y="232" font-size="17" fill="#dfeaf1" text-anchor="start">c₁ from EOS</text><path d="M251,215 L305,215" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="65" y="340" font-size="18" fill="#dfeaf1" text-anchor="start">p = P(ρ,e); e ↔ T; common energy datum</text><text x="65" y="379" font-size="16" fill="#dfeaf1" text-anchor="start">constitutive parameters live in both bulk states</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">Γ_l &gt; 1: reference thermodynamic exponent</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">p_*: stiffening pressure [Pa]</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">c_v: specified constant heat capacity [J/(kg K)]</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">p₀, ρ₀, c₀: consistent reference state</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">p is absolute in this EOS</text><text x="560" y="287" font-size="17" fill="#dfeaf1" text-anchor="start">Not a calibrated neat-PFC property law</text></g></svg>