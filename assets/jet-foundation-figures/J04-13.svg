<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Conservative planar-shock arrest benchmark</title><desc id="desc">D: shock speed relative to initial liquid; w: removed speed; 0 &lt; w &lt; D; Subscripts 0 and 1: ahead/behind shock; ρ₁ = ρ₀D/(D − w); e₁ uses the same EOS energy datum; This EOS yields the explicit D formula</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Conservative planar-shock arrest benchmark</text><rect x="65" y="144" width="440" height="144" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><path d="M270,125 L270,308" stroke="#f0c78c" stroke-width="2.2" fill="none"/><text x="78" y="180" font-size="17" fill="#dfeaf1" text-anchor="start">ahead: ρ₀, p₀, e₀</text><text x="305" y="180" font-size="17" fill="#dfeaf1" text-anchor="start">behind: ρ₁, p₁, e₁</text><text x="95" y="228" font-size="16" fill="#dfeaf1" text-anchor="start">initial liquid at rest</text><path d="M418,234 L337,234" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="366" y="265" font-size="17" fill="#dfeaf1" text-anchor="start">u₁ = −w</text><path d="M270,111 L175,111" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="230" y="99" font-size="18" fill="#dfeaf1" text-anchor="start">D</text><text x="65" y="349" font-size="16" fill="#dfeaf1" text-anchor="start">shock frame mass flux: ρ₀D = ρ₁(D−w)</text><text x="65" y="385" font-size="16" fill="#dfeaf1" text-anchor="start">D and w are positive magnitudes in these equations</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">D: shock speed relative to initial liquid</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">w: removed speed; 0 &lt; w &lt; D</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Subscripts 0 and 1: ahead/behind shock</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">ρ₁ = ρ₀D/(D − w)</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">e₁ uses the same EOS energy datum</text><text x="560" y="287" font-size="17" fill="#dfeaf1" text-anchor="start">This EOS yields the explicit D formula</text></g></svg>