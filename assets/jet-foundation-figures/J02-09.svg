<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Pressure and energy required by a steady focused jet</title><desc id="desc">p_i: inlet liquid pressure [Pa]; p_g: exterior gas pressure [Pa]; σ/a_j: cylindrical exit pressure [Pa]; Δp_loss ≥ 0: irreversible requirement; No σ/a_i term at a solid-tube inlet</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Pressure and energy required by a steady focused jet</text><path d="M60 140 L225 140 L320 185 L475 185 M60 285 L225 285 L320 240 L475 240" fill="none" stroke="#8ad9e6" stroke-width="3"/><path d="M95,213 L177,213" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M350,213 L455,213" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="74" y="122" font-size="18" fill="#dfeaf1" text-anchor="start">solid tube inlet</text><text x="80" y="247" font-size="17" fill="#dfeaf1" text-anchor="start">A_i, U_i, p_i</text><text x="337" y="171" font-size="17" fill="#dfeaf1" text-anchor="start">free jet: A_j, U_j</text><text x="347" y="267" font-size="16" fill="#dfeaf1" text-anchor="start">p_l = p_g + σ/a_j</text><text x="337" y="298" font-size="16" fill="#dfeaf1" text-anchor="start">gas outside: p_g</text><path d="M202,147 L202,278" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><text x="180" y="328" font-size="17" fill="#dfeaf1" text-anchor="start">a_i</text><path d="M325,190 L325,237" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><text x="299" y="328" font-size="17" fill="#dfeaf1" text-anchor="start">a_j</text><text x="65" y="380" font-size="17" fill="#dfeaf1" text-anchor="start">area convergence changes speed; pressure pays for it</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">p_i: inlet liquid pressure [Pa]</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">p_g: exterior gas pressure [Pa]</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">σ/a_j: cylindrical exit pressure [Pa]</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">Δp_loss ≥ 0: irreversible requirement</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">No σ/a_i term at a solid-tube inlet</text></g></svg>