<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Original fixed-mass and outgoing-wave bounds</title><desc id="desc">Jet budget = 6 nJ; fixed mass = 23.5619 ng; Separate wave control: E_w = 0.20 nJ; Wave area = π(5 μm)²; Wave window = 20 ns; Not a shared-budget claim for the synthetic history</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Original fixed-mass and outgoing-wave bounds</text><rect x="65" y="173" width="160" height="68" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="145.0" y="213" font-size="17" fill="#dfeaf1" text-anchor="middle">E_available</text><rect x="305" y="123" width="185" height="68" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="397.5" y="163" font-size="17" fill="#dfeaf1" text-anchor="middle">E_jet / E_wave</text><rect x="305" y="253" width="185" height="68" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="397.5" y="293" font-size="17" fill="#dfeaf1" text-anchor="middle">E_other</text><path d="M226,201 L299,161" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M226,213 L299,282" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="65" y="101" font-size="17" fill="#dfeaf1" text-anchor="start">same system, datum and observation interval</text><text x="65" y="358" font-size="17" fill="#dfeaf1" text-anchor="start">jet: m_j, P_j, u; wave: A, Z_l, τ</text><text x="65" y="389" font-size="16" fill="#dfeaf1" text-anchor="start">account for residual energy and boundary work</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">Jet budget = 6 nJ; fixed mass = 23.5619 ng</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">Separate wave control: E_w = 0.20 nJ</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">Wave area = π(5 μm)²</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">Wave window = 20 ns</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Not a shared-budget claim for the synthetic</text><text x="560" y="287" font-size="17" fill="#dfeaf1" text-anchor="start">history</text></g></svg>