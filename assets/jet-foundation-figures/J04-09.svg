<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Finite-mass momentum and kinetic-speed ceilings</title><desc id="desc">m_j fixed before comparing sources; E_available: assigned kinetic-energy budget; P_z: axial momentum of this tracked mass; U_rms: mass-weighted vector-speed RMS; Equality requires uniform aligned flow</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Finite-mass momentum and kinetic-speed ceilings</text><rect x="65" y="173" width="160" height="68" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="145.0" y="213" font-size="17" fill="#dfeaf1" text-anchor="middle">E_available</text><rect x="305" y="123" width="185" height="68" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="397.5" y="163" font-size="17" fill="#dfeaf1" text-anchor="middle">E_jet / E_wave</text><rect x="305" y="253" width="185" height="68" rx="8" fill="#182c3b" stroke="#8ad9e6" stroke-width="2"/><text x="397.5" y="293" font-size="17" fill="#dfeaf1" text-anchor="middle">E_other</text><path d="M226,201 L299,161" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><path d="M226,213 L299,282" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="65" y="101" font-size="17" fill="#dfeaf1" text-anchor="start">same system, datum and observation interval</text><text x="65" y="358" font-size="17" fill="#dfeaf1" text-anchor="start">jet: m_j, P_j, u; wave: A, Z_l, τ</text><text x="65" y="389" font-size="16" fill="#dfeaf1" text-anchor="start">account for residual energy and boundary work</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">m_j fixed before comparing sources</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">E_available: assigned kinetic-energy budget</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">P_z: axial momentum of this tracked mass</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">U_rms: mass-weighted vector-speed RMS</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Equality requires uniform aligned flow</text></g></svg>