<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Original one-wavelength droplet-volume formula</title><desc id="desc">Jet diameter = 10 μm; λ_* ≈ 45.0718 μm; One spherical drop per wavelength; Satellite liquid omitted in the estimate; Nonlinear neck/end/ambient dynamics separate</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Original one-wavelength droplet-volume formula</text><rect x="70" y="170" width="185" height="72" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><path d="M73,300 L252,300" stroke="#8ad9e6" stroke-width="2.2" fill="none"/><text x="157" y="327" font-size="17" fill="#dfeaf1" text-anchor="middle">one wavelength λ</text><path d="M75,206 L75,175" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="88" y="196" font-size="17" fill="#dfeaf1" text-anchor="start">a</text><path d="M275,206 L333,206" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><circle cx="410" cy="205" r="61" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><path d="M410,205 L463,205" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="417" y="194" font-size="17" fill="#dfeaf1" text-anchor="start">a_d</text><text x="95" y="118" font-size="18" fill="#dfeaf1" text-anchor="start">cylinder volume</text><text x="355" y="118" font-size="18" fill="#dfeaf1" text-anchor="start">sphere volume</text><text x="65" y="378" font-size="17" fill="#dfeaf1" text-anchor="start">equal liquid volume; satellites omitted in this control</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">Jet diameter = 10 μm</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">λ_* ≈ 45.0718 μm</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">One spherical drop per wavelength</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">Satellite liquid omitted in the estimate</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Nonlinear neck/end/ambient dynamics separate</text></g></svg>