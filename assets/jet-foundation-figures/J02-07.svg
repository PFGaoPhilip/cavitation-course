<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 445" role="img" aria-labelledby="title desc"><title id="title">Example mechanical closure and initial/boundary data</title><desc id="desc">V₀ and p_g0: declared gas reference; p_v: prescribed constant vapor contribution; k: polytropic exponent for this control; V_wall: actual wall velocity [m/s]; Γ₀, φ₀: initial shape and flow state</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#8ad9e6"/></marker></defs><rect width="1050" height="445" fill="#101e29"/><g font-family="Arial, sans-serif"><text x="35" y="45" font-size="22" fill="#dfeaf1" text-anchor="start">Example mechanical closure and initial/boundary data</text><circle cx="255" cy="218" r="76" fill="#182c3b" stroke="#8ad9e6" stroke-width="2.5"/><text x="255" y="219" font-size="18" fill="#dfeaf1" text-anchor="middle">gas: p_g</text><text x="54" y="109" font-size="18" fill="#dfeaf1" text-anchor="start">liquid Ω: ρ, u = ∇φ, p_l</text><text x="329" y="161" font-size="17" fill="#dfeaf1" text-anchor="start">Γ(t), X(t)</text><path d="M377,220 L330,220" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="387" y="224" font-size="16" fill="#dfeaf1" text-anchor="start">n: liquid → gas</text><path d="M310,166 L345,131" stroke="#8ad9e6" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="350" y="128" font-size="16" fill="#dfeaf1" text-anchor="start">u(X), V_n</text><text x="75" y="355" font-size="17" fill="#dfeaf1" text-anchor="start">on Γ: κ, σ; cavity sphere κ = −2/R</text><text x="75" y="382" font-size="17" fill="#dfeaf1" text-anchor="start">far field: p_∞, φ → 0; wall: specified u_n</text><path d="M535,85 L535,410" stroke="#405365" stroke-width="2.2" fill="none"/><text x="560" y="101" font-size="19" fill="#dfeaf1" text-anchor="start">Variables and the declared control</text><text x="560" y="137" font-size="17" fill="#dfeaf1" text-anchor="start">V₀ and p_g0: declared gas reference</text><text x="560" y="167" font-size="17" fill="#dfeaf1" text-anchor="start">p_v: prescribed constant vapor contribution</text><text x="560" y="197" font-size="17" fill="#dfeaf1" text-anchor="start">k: polytropic exponent for this control</text><text x="560" y="227" font-size="17" fill="#dfeaf1" text-anchor="start">V_wall: actual wall velocity [m/s]</text><text x="560" y="257" font-size="17" fill="#dfeaf1" text-anchor="start">Γ₀, φ₀: initial shape and flow state</text></g></svg>