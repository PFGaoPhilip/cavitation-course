<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="658" viewBox="0 0 1080 658" role="img"><title>Structural motion and interfacial release · original governing laws</title><desc>J_nom: nucleation rate / areal impulse; m&#x27;: mass or areal mass; G_c: fracture work per release area; Π_J: impulse availability ratio; J_A: selected areal pressure impulse; E: energy / elastic modulus as defined; A: area / volume-acceleration coefficient</desc><rect width="1080" height="658" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><path d="M100,203 L160,203 Q350,330 550,203 L635,203" fill="none" stroke="#82d9ee" stroke-width="4"/><path d="M230,107 L230,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="230,220 235.0,209.0 225.0,209.0" fill="#ffd39a"/><path d="M350,107 L350,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="350,220 355.0,209.0 345.0,209.0" fill="#ffd39a"/><path d="M470,107 L470,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="470,220 475.0,209.0 465.0,209.0" fill="#ffd39a"/><text x="170" y="78" fill="#e8f1f6" font-size="20" text-anchor="start">p(s,t) → Qn = ∫p φn dA</text><text x="365" y="280" fill="#e8f1f6" font-size="18" text-anchor="start">q(t), w(s,t)=φ(s)q(t)</text><path d="M160,312 L550,312" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="550,312 539.0,307.0 539.0,317.0" fill="#82d9ee"/><text x="303" y="338" fill="#e8f1f6" font-size="17" text-anchor="start">a · span / 跨度</text><text x="635" y="138" fill="#e8f1f6" font-size="19" text-anchor="start">Mq, Cq, Kq</text><text x="635" y="171" fill="#e8f1f6" font-size="19" text-anchor="start">ωn, ζ</text><text x="110" y="275" fill="#e8f1f6" font-size="17" text-anchor="start">h, D, mA</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">J_nom  ·  nucleation rate / areal impulse</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">event / 成核率／面冲量</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">m&#x27;  ·  mass or areal mass</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">mass / 质量或面密度</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">G_c  ·  fracture work per release area</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">cohesive interface / 单位释放面积断裂功</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">Π_J  ·  impulse availability ratio</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">screen / 冲量可用性比</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">J_A  ·  selected areal pressure impulse</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">load / 选定面压力冲量</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">E  ·  energy / elastic modulus as defined</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 按定义为能量／弹性模量</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">A  ·  area / volume-acceleration coefficient</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 面积／体积加速度系数</text></g></svg>