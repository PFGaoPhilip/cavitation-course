<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="658" viewBox="0 0 1080 658" role="img"><title>How lasers create bubbles and loading · original governing laws</title><desc>p_init: pressure at the indicated location; Γ: Grüneisen parameter; H_abs: enthalpy / absorbed dose / liquid depth; t_stress: physical time; ℓ: absorption / cohesive-zone length; c: sound speed / heat capacity; t_thermal: physical time; α: thermal diffusivity</desc><rect width="1080" height="658" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="150" y="157" width="530" height="126" fill="#263d48" stroke="#405466"/><path d="M270,85 L270,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="270,177 275.0,166.0 265.0,166.0" fill="#ffd39a"/><path d="M355,85 L355,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="355,177 360.0,166.0 350.0,166.0" fill="#ffd39a"/><path d="M440,85 L440,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="440,177 445.0,166.0 435.0,166.0" fill="#ffd39a"/><text x="190" y="70" fill="#e8f1f6" font-size="20" text-anchor="start">F(r), Ep, ηabs; pulse g(t), τL</text><path d="M355,166 L355,277" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="355,277 360.0,266.0 350.0,266.0" fill="#82d9ee"/><text x="365" y="225" fill="#e8f1f6" font-size="18" text-anchor="start">z; μa = 1/δabs</text><path d="M355,145 L480,145" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="480,145 469.0,140.0 469.0,150.0" fill="#82d9ee"/><text x="445" y="129" fill="#e8f1f6" font-size="17" text-anchor="start">r, w0</text><text x="165" y="317" fill="#e8f1f6" font-size="19" text-anchor="start">Q&#x27;&#x27;&#x27;(r,z,t) → Dabs → ΔT · absorber / 吸收体</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">p_init  ·  pressure at the indicated location</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">Γ  ·  Grüneisen parameter</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / Grüneisen 参数</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">H_abs  ·  enthalpy / absorbed dose / liquid depth</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 焓／吸收剂量／液深</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">t_stress  ·  physical time</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">ℓ  ·  absorption / cohesive-zone length</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 吸收／黏聚区长度</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">c  ·  sound speed / heat capacity</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">material / 声速／比热</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">t_thermal  ·  physical time</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">α  ·  thermal diffusivity</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">material / 热扩散率</text></g></svg>