<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img"><title>Capstone: a liquid–PVC–film research model · original governing laws</title><desc>γ: stand-off / heat-capacity ratio; h: stand-off / layer thickness; R_max: maximum expansion radius; χ: confinement / susceptibility; H_L: enthalpy / absorbed dose / liquid depth; λ_f: bubble-to-film size ratio; a_f: droplet radius / film span / acceleration; Θ: loading-to-mode timing ratio; ω_n: structural modal angular frequency; T_b: temperature / kinetic energy as defined</desc><rect width="1080" height="710" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><path d="M100,203 L160,203 Q350,330 550,203 L635,203" fill="none" stroke="#82d9ee" stroke-width="4"/><path d="M230,107 L230,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="230,220 235.0,209.0 225.0,209.0" fill="#ffd39a"/><path d="M350,107 L350,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="350,220 355.0,209.0 345.0,209.0" fill="#ffd39a"/><path d="M470,107 L470,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="470,220 475.0,209.0 465.0,209.0" fill="#ffd39a"/><text x="170" y="78" fill="#e8f1f6" font-size="20" text-anchor="start">p(s,t) → Qn = ∫p φn dA</text><text x="365" y="280" fill="#e8f1f6" font-size="18" text-anchor="start">q(t), w(s,t)=φ(s)q(t)</text><path d="M160,312 L550,312" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="550,312 539.0,307.0 539.0,317.0" fill="#82d9ee"/><text x="303" y="338" fill="#e8f1f6" font-size="17" text-anchor="start">a · span / 跨度</text><text x="635" y="138" fill="#e8f1f6" font-size="19" text-anchor="start">Mq, Cq, Kq</text><text x="635" y="171" fill="#e8f1f6" font-size="19" text-anchor="start">ωn, ζ</text><text x="110" y="275" fill="#e8f1f6" font-size="17" text-anchor="start">h, D, mA</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">γ  ·  stand-off / heat-capacity ratio</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 离壁比／热容比</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">h  ·  stand-off / layer thickness</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">boundary / 中心离壁距离／层厚</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">R_max  ·  maximum expansion radius</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 最大膨胀半径</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">χ  ·  confinement / susceptibility</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 约束比／响应率</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">H_L  ·  enthalpy / absorbed dose / liquid depth</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 焓／吸收剂量／液深</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">λ_f  ·  bubble-to-film size ratio</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 气泡与膜尺寸比</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">a_f  ·  droplet radius / film span / acceleration</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 液滴半径／膜跨度／加速度</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">Θ  ·  loading-to-mode timing ratio</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 加载与模态时序比</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">ω_n  ·  structural modal angular frequency</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">structure / 结构模态角频率</text><text x="550" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">T_b  ·  temperature / kinetic energy as defined</text><text x="550" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 按定义为温度／动能</text></g></svg>