<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img"><title>1.2 From pulse energy to a time-dependent source / 从脉冲能量到时变热源</title><desc>I: pressure or modal impulse; r: liquid observation radius / embryo radius; t: physical time; F: force / fluence</desc><rect width="1080" height="600" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><circle cx="280" cy="210" r="85" fill="#1b3445" stroke="#82d9ee" stroke-width="3"/><path d="M280,210 L365,210" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="365,210 354.0,205.0 354.0,215.0" fill="#82d9ee"/><text x="292" y="200" fill="#e8f1f6" font-size="16" text-anchor="start">R(t) · wall / 壁面</text><text x="225" y="255" fill="#e8f1f6" font-size="18" text-anchor="start">pB = pg + pv</text><path d="M373,220 L427,220" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="427,220 416.0,215.0 416.0,225.0" fill="#82d9ee"/><text x="377" y="255" fill="#e8f1f6" font-size="19" text-anchor="start">Ṙ, R̈</text><circle cx="280" cy="210" r="128" fill="none" stroke="#405466" stroke-dasharray="6 5"/><path d="M280,200 L480,135" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="480,135 467.9931948822718,133.64477645205838 471.0840556056474,143.1551171393679" fill="#82d9ee"/><text x="430" y="123" fill="#e8f1f6" font-size="16" text-anchor="start">r · observation / 观测</text><text x="480" y="195" fill="#e8f1f6" font-size="19" text-anchor="start">p(r,t), u(r,t)</text><text x="490" y="245" fill="#e8f1f6" font-size="17" text-anchor="start">ρ, μ · liquid / 液体</text><text x="490" y="280" fill="#e8f1f6" font-size="16" text-anchor="start">p∞ · distant liquid / 远处</text><text x="80" y="315" fill="#e8f1f6" font-size="17" text-anchor="start">σ · spherical interface / 球形界面</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">I  ·  pressure or modal impulse</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">load / 压力或模态冲量</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">r  ·  liquid observation radius / embryo radius</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 液体观测半径／胚核半径</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">F  ·  force / fluence</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">source / 力／能量面密度</text></g></svg>