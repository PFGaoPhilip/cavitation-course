<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img"><title>Jets, pressure impulse and liquid transfer · original governing laws</title><desc>We_j: inertia-to-capillary ratio; ρ: liquid / layer / droplet density; U_j: velocity / velocity scale; σ: interface tension / solid stress; Oh_j: viscous-to-capillary ratio; μ: dynamic viscosity / absorption coefficient; q_j: heat flux / mode displacement; F_steady: force / fluence; π: circle geometry constant</desc><rect width="1080" height="710" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="175" y="156" width="395" height="105" fill="#1b3445" stroke="#82d9ee" stroke-width="3"/><path d="M98,175 L172,175" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="172,175 161.0,170.0 161.0,180.0" fill="#ffd39a"/><path d="M98,210 L172,210" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="172,210 161.0,205.0 161.0,215.0" fill="#ffd39a"/><path d="M98,245 L172,245" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="172,245 161.0,240.0 161.0,250.0" fill="#ffd39a"/><path d="M175,277 L570,277" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="570,277 559.0,272.0 559.0,282.0" fill="#82d9ee"/><text x="343" y="306" fill="#e8f1f6" font-size="20" text-anchor="start">L</text><path d="M590,210 L765,210" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="765,210 754.0,205.0 754.0,215.0" fill="#82d9ee"/><text x="610" y="181" fill="#e8f1f6" font-size="20" text-anchor="start">ΔU / Uj</text><text x="90" y="126" fill="#e8f1f6" font-size="18" text-anchor="start">Δp acts for τ · 压差持续 τ</text><text x="225" y="224" fill="#e8f1f6" font-size="20" text-anchor="start">ρ; Ip = ∫Δp dt</text><text x="113" y="343" fill="#e8f1f6" font-size="16" text-anchor="start">Slug speed change ≠ focused bubble jet / 液柱速度变化不等于聚焦泡射流</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">We_j  ·  inertia-to-capillary ratio</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">scales / 惯性与毛细比</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">ρ  ·  liquid / layer / droplet density</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">U_j  ·  velocity / velocity scale</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">motion / 速度／速度尺度</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">σ  ·  interface tension / solid stress</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">interface / 界面张力／固体应力</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">Oh_j  ·  viscous-to-capillary ratio</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">scales / 黏性与毛细比</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">μ  ·  dynamic viscosity / absorption coefficient</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">material / 动力黏度／吸收系数</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">q_j  ·  heat flux / mode displacement</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">interface / 热通量／模态位移</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">F_steady  ·  force / fluence</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">source / 力／能量面密度</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">π  ·  circle geometry constant</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 圆几何常数</text></g></svg>