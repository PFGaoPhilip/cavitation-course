<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="762" viewBox="0 0 1080 762" role="img"><title>Optical deposition · original governing laws</title><desc>D_abs,0: absorbed energy density; η_abs: absorbed fraction; F_0: peak beam fluence; δ_abs: optical absorption depth; q̇&#x27;&#x27;&#x27;_max: peak volumetric deposition rate; π: circle geometry constant; τ_L: laser pulse FWHM; Δ: change / pressure difference; T_ad: temperature / kinetic energy as defined; ρ_abs: liquid / layer / droplet density; c_p: sound speed / heat capacity</desc><rect width="1080" height="762" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="150" y="157" width="530" height="126" fill="#263d48" stroke="#405466"/><path d="M270,85 L270,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="270,177 275.0,166.0 265.0,166.0" fill="#ffd39a"/><path d="M355,85 L355,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="355,177 360.0,166.0 350.0,166.0" fill="#ffd39a"/><path d="M440,85 L440,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="440,177 445.0,166.0 435.0,166.0" fill="#ffd39a"/><text x="190" y="70" fill="#e8f1f6" font-size="20" text-anchor="start">F(r), Ep, ηabs; pulse g(t), τL</text><path d="M355,166 L355,277" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="355,277 360.0,266.0 350.0,266.0" fill="#82d9ee"/><text x="365" y="225" fill="#e8f1f6" font-size="18" text-anchor="start">z; μa = 1/δabs</text><path d="M355,145 L480,145" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="480,145 469.0,140.0 469.0,150.0" fill="#82d9ee"/><text x="445" y="129" fill="#e8f1f6" font-size="17" text-anchor="start">r, w0</text><text x="165" y="317" fill="#e8f1f6" font-size="19" text-anchor="start">Q&#x27;&#x27;&#x27;(r,z,t) → Dabs → ΔT · absorber / 吸收体</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">D_abs,0  ·  absorbed energy density</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 吸收能量密度</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">η_abs  ·  absorbed fraction</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">optical source / 吸收比例</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">F_0  ·  peak beam fluence</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">beam centre / 光束峰值能量面密度</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">δ_abs  ·  optical absorption depth</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">absorber depth / 光学吸收深度</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">q̇&#x27;&#x27;&#x27;_max  ·  peak volumetric deposition rate</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 峰值体积沉积率</text><text x="35" y="685" fill="#e8f1f6" font-size="15" text-anchor="start">π  ·  circle geometry constant</text><text x="35" y="706" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 圆几何常数</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">τ_L  ·  laser pulse FWHM</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">laser clock / 激光脉冲半峰全宽</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">Δ  ·  change / pressure difference</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">difference / 变化量／压差</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">T_ad  ·  temperature / kinetic energy as defined</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 按定义为温度／动能</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start