<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img"><title>1.3 From surface intensity to volumetric heating / 从表面光强到体积热源</title><desc>Q&#x27;&#x27;&#x27;: volumetric heat deposition rate; r: distance from beam axis; z: depth into absorber; t: physical time; η_abs: absorbed fraction; F: local beam fluence; g: unit-integral pulse profile; μ_a: optical absorption coefficient; δ_abs: optical absorption depth</desc><rect width="1080" height="710" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="150" y="157" width="530" height="126" fill="#263d48" stroke="#405466"/><path d="M270,85 L270,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="270,177 275.0,166.0 265.0,166.0" fill="#ffd39a"/><path d="M355,85 L355,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="355,177 360.0,166.0 350.0,166.0" fill="#ffd39a"/><path d="M440,85 L440,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="440,177 445.0,166.0 435.0,166.0" fill="#ffd39a"/><text x="190" y="70" fill="#e8f1f6" font-size="20" text-anchor="start">F(r), Ep, ηabs; pulse g(t), τL</text><path d="M355,166 L355,277" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="355,277 360.0,266.0 350.0,266.0" fill="#82d9ee"/><text x="365" y="225" fill="#e8f1f6" font-size="18" text-anchor="start">z; μa = 1/δabs</text><path d="M355,145 L480,145" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="480,145 469.0,140.0 469.0,150.0" fill="#82d9ee"/><text x="445" y="129" fill="#e8f1f6" font-size="17" text-anchor="start">r, w0</text><text x="165" y="317" fill="#e8f1f6" font-size="19" text-anchor="start">Q&#x27;&#x27;&#x27;(r,z,t) → Dabs → ΔT · absorber / 吸收体</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">Q&#x27;&#x27;&#x27;  ·  volumetric heat deposition rate</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 体积热沉积率</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">r  ·  distance from beam axis</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">beam plane / 距光轴距离</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">z  ·  depth into absorber</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 进入吸收体的深度</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">η_abs  ·  absorbed fraction</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">optical source / 吸收比例</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">F  ·  local beam fluence</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">beam / 局部光束能量面密度</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">g  ·  unit-integral pulse profile</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">laser clock / 单位积分脉冲分布</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">μ_a  ·  optical absorption coefficient</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">absorber depth / 光学吸收系数</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">δ_abs  ·  optical absorption depth</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">absorber depth / 光学吸收深度</text></g></svg>