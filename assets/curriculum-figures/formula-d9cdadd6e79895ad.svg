ize="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">p&#x27;  ·  pressure at the indicated location</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">s  ·  in-plane radial coordinate</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">film / 平面内径向坐标</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">ρ_l  ·  liquid / layer / droplet density</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">A  ·  area / volume-acceleration coefficient</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 面积／体积加速度系数</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">B  ·  kinetic pressure coefficient</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">liquid / 运动压力系数</text></g></svg>