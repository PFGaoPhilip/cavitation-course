<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img"><title>7.5 What the far-field pressure means / 远场压力究竟表示什么</title><desc>p&#x27;: pressure at the indicated location; r: liquid observation radius / embryo radius; t: physical time; ρ: liquid / layer / droplet density; π: circle geometry constant; V̈: bubble or observation volume; c: sound speed / heat capacity; R: instantaneous wall radius; R̈: radial wall acceleration; Ṙ: radial wall velocity</desc><rect width="1080" height="710" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><circle cx="195" cy="205" r="45" fill="#1b3445" stroke="#82d9ee" stroke-width="3"/><path d="M195,205 L240,205" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="240,205 229.0,200.0 229.0,210.0" fill="#82d9ee"/><text x="207" y="195" fill="#e8f1f6" font-size="16" text-anchor="start">R(t) · wall / 壁面</text><text x="140" y="250" fill="#e8f1f6" font-size="18" text-anchor="start">pB = pg + pv</text><path d="M248,215 L302,215" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="302,215 291.0,210.0 291.0,220.0" fill="#82d9ee"/><text x="252" y="250" fill="#e8f1f6" font-size="19" text-anchor="start">Ṙ, R̈</text><circle cx="195" cy="205" r="75" fill="none" stroke="#405466"/><circle cx="195" cy="205" r="110" fill="none" stroke="#405466"/><circle cx="195" cy="205" r="150" fill="none" stroke="#405466"/><path d="M240,205 L695,205" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="695,205 684.0,200.0 684.0,210.0" fill="#82d9ee"/><text x="490" y="189" fill="#e8f1f6" font-size="20" text-anchor="start">r; arrival t−r/c</text><circle cx="710" cy="205" r="12" fill="#ffd39a"/><text x="640" y="257" fill="#e8f1f6" font-size="17" text-anchor="start">Pressure observer / 压力观测</text><text x="170" y="85" fill="#e8f1f6" font-size="20" text-anchor="start">V̈(t) radiates sound / 体积加速度辐射声波</text><text x="110" y="329" fill="#e8f1f6" font-size="17" text-anchor="start">p′ ∝ 1/r; intensity ∝ p′²/(ρc) / 压力与能流的衰减不同</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">p&#x27;  ·  pressure at the indicated location</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">r  ·  liquid observation radius / embryo radius</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 液体观测半径／胚核半径</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">ρ  ·  liquid / layer / droplet density</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">π  ·  circle geometry constant</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 圆几何常数</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">V̈  ·  bubble or observation volume</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">volume / 气泡或观测体积</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">c  ·  sound speed / heat capacity</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">material / 声速／比热</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">R  ·  instantaneous wall radius</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 瞬时壁面半径</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">R̈  ·  radial wall acceleration</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 径向壁面加速度</text><text x="550" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">Ṙ  ·  radial wall velocity</text><text x="550" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 径向壁面速度</text></g></svg>