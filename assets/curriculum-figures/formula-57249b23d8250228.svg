<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img"><title>16.25 Source-mechanism classification / 源机制分类</title><desc>E_laser: energy / elastic modulus as defined; p_acoustic: pressure at the indicated location; t: physical time; R: instantaneous wall radius</desc><rect width="1080" height="600" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="35" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="47" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Optics</text><text x="47" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">光学</text><path d="M209,197 L233,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="233,197 222.0,192.0 222.0,202.0" fill="#82d9ee"/><rect x="240" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="252" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Activation</text><text x="252" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">激活</text><path d="M414,197 L438,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="438,197 427.0,192.0 427.0,202.0" fill="#82d9ee"/><rect x="445" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="457" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Bubble motion</text><text x="457" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">泡运动</text><path d="M619,197 L643,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="643,197 632.0,192.0 632.0,202.0" fill="#82d9ee"/><rect x="650" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="662" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Structure</text><text x="662" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">结构</text><path d="M824,197 L848,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="848,197 837.0,192.0 837.0,202.0" fill="#82d9ee"/><rect x="855" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="867" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Release / tests</text><text x="867" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">释放／检验</text><text x="105" y="308" fill="#e8f1f6" font-size="18" text-anchor="start">Each arrow requires its own closure or measurement / 每一连接都需要自身闭合或测量</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">E_laser  ·  energy / elastic modulus as defined</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 按定义为能量／弹性模量</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">p_acoustic  ·  pressure at the indicated location</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">R  ·  instantaneous wall radius</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 瞬时壁面半径</text></g></svg>