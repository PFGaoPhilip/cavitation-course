<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="606" viewBox="0 0 1080 606" role="img"><title>3.4 Deriving the Rayleigh collapse time / 推导 Rayleigh 塌缩时间</title><desc>t_R: physical time; R_max: maximum expansion radius; ρ_l: liquid / layer / droplet density; Δ: change / pressure difference; p: pressure at the indicated location; x: position / dimensionless radius</desc><rect width="1080" height="606" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><path d="M145,302 L145,101" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="145,101 140.0,112.0 150.0,112.0" fill="#82d9ee"/><path d="M145,302 L750,302" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="750,302 739.0,297.0 739.0,307.0" fill="#82d9ee"/><path d="M150,130 C285,100 490,120 585,193 C640,235 650,280 675,300" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="180" y="92" fill="#e8f1f6" font-size="18" text-anchor="start">Radius / output / error · 半径／输出／误差</text><text x="540" y="333" fill="#e8f1f6" font-size="16" text-anchor="start">t, τ, x · independent coordinate / 自变量</text><path d="M680,145 L680,296" stroke="#ffd39a" stroke-width="2.5" fill="none"/><text x="685" y="130" fill="#e8f1f6" font-size="17" text-anchor="start">cutoff / event</text><text x="170" y="353" fill="#e8f1f6" font-size="17" text-anchor="start">Initial state → trajectory → observable / 初态 → 历程 → 观测量</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">t_R  ·  physical time</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">R_max  ·  maximum expansion radius</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 最大膨胀半径</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">ρ_l  ·  liquid / layer / droplet density</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">Δ  ·  change / pressure difference</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">difference / 变化量／压差</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">p  ·  pressure at the indicated location</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">x  ·  position / dimensionless radius</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">coordinate / 位置／无量纲半径</text></g></svg>