<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="814" viewBox="0 0 1080 814" role="img"><title>Capstone: a liquid–PVC–film research model · original governing laws</title><desc>Q_n: heat or generalized load as defined; t: physical time; Δ: change / pressure difference; p: pressure at the indicated location; x: position / dimensionless radius; φ_n: assumed spatial mode shape; A: area / volume-acceleration coefficient; M_n: generalized mass / molar mass; q̈_n: generalized mode displacement; C_n: gas-content constant / damping; q̇_n: generalized mode displacement; K_n: stiffness / collapse constant; q_n: generalized mode displacement</desc><rect width="1080" height="814" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><path d="M100,203 L160,203 Q350,330 550,203 L635,203" fill="none" stroke="#82d9ee" stroke-width="4"/><path d="M230,107 L230,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="230,220 235.0,209.0 225.0,209.0" fill="#ffd39a"/><path d="M350,107 L350,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="350,220 355.0,209.0 345.0,209.0" fill="#ffd39a"/><path d="M470,107 L470,220" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="470,220 475.0,209.0 465.0,209.0" fill="#ffd39a"/><text x="170" y="78" fill="#e8f1f6" font-size="20" text-anchor="start">p(s,t) → Qn = ∫p φn dA</text><text x="365" y="280" fill="#e8f1f6" font-size="18" text-anchor="start">q(t), w(s,t)=φ(s)q(t)</text><path d="M160,312 L550,312" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="550,312 539.0,307.0 539.0,317.0" fill="#82d9ee"/><text x="303" y="338" fill="#e8f1f6" font-size="17" text-anchor="start">a · span / 跨度</text><text x="635" y="138" fill="#e8f1f6" font-size="19" text-anchor="start">Mq, Cq, Kq</text><text x="635" y="171" fill="#e8f1f6" font-size="19" text-anchor="start">ωn, ζ</text><text x="110" y="275" fill="#e8f1f6" font-size="17" text-anchor="start">h, D, mA</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">Q_n  ·  heat or generalized load as defined</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">load / 按定义为热量或广义载荷</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">Δ  ·  change / pressure difference</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">difference / 变化量／压差</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">p  ·  pressure at the indicated location</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">x  ·  position / dimensionless radius</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">coordinate / 位置／无量纲半径</text><text x="35" y="685" fill="#e8f1f6" font-size="15" text-anchor="start">φ_n  ·  assumed spatial mode shape</text><text x="35" y="706" fill="#b1c2cf" font-size="14" text-anchor="start">film / 假设空间模态形状</text><text x="35" y="737" fill="#e8f1f6" font-size="15" text-anchor="start">A  ·  area / volume-acceleration coefficient</text><text x="35" y="758" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 面积／体积加速度系数</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">M_n  ·  generalized mass / molar mass</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">mass / 广义质量／摩尔质量</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">q̈_n  ·  generalized mode displacement</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">film centre / 广义模态位移</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">C_n  ·  gas-content constant / damping</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">closure / 气体存量常数／阻尼</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">q̇_n  ·  generalized mode displacement</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">film centre / 广义模态位移</text><text x="550" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">K_n  ·  stiffness / collapse constant</text><text x="550" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">structure / 刚度／塌缩常数</text><text x="550" y="685" fill="#e8f1f6" font-size="15" text-anchor="start">q_n  ·  generalized mode displacement</text><text x="550" y="706" fill="#b1c2cf" font-size="14" text-anchor="start">film centre / 广义模态位移</text></g></svg>