<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img"><title>8.1 A radius is not a shape / 半径不能代表全部形状</title><desc>ä_ℓ: droplet radius / film span / acceleration; Ṙ: radial wall velocity; R: instantaneous wall radius; ȧ_ℓ: droplet radius / film span / acceleration; ℓ: absorption / cohesive-zone length; σ: interface tension / solid stress; ρ: liquid / layer / droplet density; R̈: radial wall acceleration; a_ℓ: droplet radius / film span / acceleration</desc><rect width="1080" height="710" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><circle cx="255" cy="180" r="70" fill="#1b3445" stroke="#82d9ee" stroke-width="3"/><path d="M255,180 L325,180" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="325,180 314.0,175.0 314.0,185.0" fill="#82d9ee"/><text x="267" y="170" fill="#e8f1f6" font-size="16" text-anchor="start">R(t) · wall / 壁面</text><text x="200" y="225" fill="#e8f1f6" font-size="18" text-anchor="start">pB = pg + pv</text><path d="M333,190 L387,190" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="387,190 376.0,185.0 376.0,195.0" fill="#82d9ee"/><text x="337" y="225" fill="#e8f1f6" font-size="19" text-anchor="start">Ṙ, R̈</text><path d="M50,300 L770,300" stroke="#ffd39a" stroke-width="2.5" fill="none"/><text x="70" y="330" fill="#e8f1f6" font-size="17" text-anchor="start">Wall / film / free surface · 壁面／膜／自由表面</text><path d="M255,180 L255,296" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="255,296 260.0,285.0 250.0,285.0" fill="#82d9ee"/><text x="265" y="279" fill="#e8f1f6" font-size="17" text-anchor="start">h, γ=h/Rmax</text><path d="M198,136 Q265,75 313,153 Q345,235 268,249 Q195,260 191,170" fill="none" stroke="#ffd39a" stroke-width="2"/><text x="460" y="138" fill="#e8f1f6" font-size="19" text-anchor="start">al Ylm · shape / 形状</text><path d="M460,148 L325,130" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="325,130 335.242688