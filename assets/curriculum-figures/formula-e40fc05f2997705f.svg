<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="970" viewBox="0 0 1080 970" role="img"><title>The complete picture / 完整图景</title><desc>F: force / fluence; r: liquid observation radius / embryo radius; g: temporal pulse profile / wall gap; t: physical time; μ_a: optical absorption coefficient; Q&#x27;&#x27;&#x27;: volumetric heat deposition rate; x: position / dimensionless radius; D_abs: absorbed dose per unit volume; E_abs: total absorbed energy; p: pressure at the indicated location; q̇&#x27;&#x27;&#x27;_max: peak volumetric deposition rate; p_1: single-droplet true-event probability; P_ge1: at least one true event; P_det: detected-event probability; R: instantaneous wall radius; Ṙ: radial wall velocity; R̈: radial wall acceleration; p&#x27;: pressure at the indicated location; q: heat flux / mode displacement</desc><rect width="1080" height="970" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="35" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="47" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Optics</text><text x="47" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">光学</text><path d="M209,197 L233,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="233,197 222.0,192.0 222.0,202.0" fill="#82d9ee"/><rect x="240" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="252" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Activation</text><text x="252" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">激活</text><path d="M414,197 L438,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="438,197 427.0,192.0 427.0,202.0" fill="#82d9ee"/><rect x="445" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="457" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Bubble motion</text><text x="457" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">泡运动</text><path d="M619,197 L643,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="643,197 632.0,192.0 632.0,202.0" fill="#82d9ee"/><rect x="650" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="662" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Structure</text><text x="662" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">结构</text><path d="M824,197 L848,197" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="848,197 837.0,192.0 837.0,202.0" fill="#82d9ee"/><rect x="855" y="140" width="170" height="115" rx="7" fill="#1b3445" stroke="#82d9ee"/><text x="867" y="183" fill="#e8f1f6" font-size="17" text-anchor="start">Release / tests</text><text x="867" y="217" fill="#e8f1f6" font-size="17" text-anchor="start">释放／检验</text><text x="105" y="308" fill="#e8f1f6" font-size="18" text-anchor="start">Each arrow requires its own closure or measurement / 每一连接都需要自身闭合或测量</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">F  ·  force / fluence</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">source / 力／能量面密度</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">r  ·  liquid observation radius / embryo radius</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 液体观测半径／胚核半径</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">g  ·  temporal pulse profile / wall gap</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">source / 时间脉冲分布／壁面间隙</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">μ_a  ·  optical absorption coefficient</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">absorber depth / 光学吸收系数</text><text x="35" y="685" fill="#e8f1f6" font-size="15" text-anchor="start">Q&#x27;&#x27;&#x27;  ·  volumetric heat deposition rate</text><text x="35" y="706" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 体积热沉积率</text><text x="35" y="737" fill="#e8f1f6" font-size="15" text-anchor="start">x  ·  position / dimensionless radius</text><text x="35" y="758" fill="#b1c2cf" font-size="14" text-anchor="start">coordinate / 位置／无量纲半径</text><text x="35" y="789" fill="#e8f1f6" font-size="15" text-anchor="start">D_abs  ·  absorbed dose per unit volume</text><text x="35" y="810" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 单位体积吸收剂量</text><text x="35" y="841" fill="#e8f1f6" font-size="15" text-anchor="start">E_abs  ·  total absorbed energy</text><text x="35" y="862" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 总吸收能量</text><text x="35" y="893" fill="#e8f1f6" font-size="15" text-anchor="start">p  ·  pressure at the indicated location</text><text x="35" y="914" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">q̇&#x27;&#x27;&#x27;_max  ·  peak volumetric deposition rate</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">absorber / 峰值体积沉积率</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">p_1  ·  single-droplet true-event probability</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">droplet / 单液滴真实事件概率</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">P_ge1  ·  at least one true event</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">population / 至少一个真实事件</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">P_det  ·  detected-event probability</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">detector / 检测到事件的概率</text><text x="550" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">R  ·  instantaneous wall radius</text><text x="550" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 瞬时壁面半径</text><text x="550" y="685" fill="#e8f1f6" font-size="15" text-anchor="start">Ṙ  ·  radial wall velocity</text><text x="550" y="706" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 径向壁面速度</text><text x="550" y="737" fill="#e8f1f6" font-size="15" text-anchor="start">R̈  ·  radial wall acceleration</text><text x="550" y="758" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 径向壁面加速度</text><text x="550" y="789" fill="#e8f1f6" font-size="15" text-anchor="start">p&#x27;  ·  pressure at the indicated location</text><text x="550" y="810" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="550" y="841" fill="#e8f1f6" font-size="15" text-anchor="start">q  ·  heat flux / mode displacement</text><text x="550" y="862" fill="#b1c2cf" font-size="14" text-anchor="start">interface / 热通量／模态位移</text></g></svg>