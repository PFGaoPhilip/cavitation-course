<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img"><title>Why this equation does not yet predict laser-induced growth / 为什么该方程还不能预测激光诱导增长</title><desc>p_B,required: pressure at the indicated location; t: physical time; p∞: ambient liquid pressure; ρ_l: liquid / layer / droplet density; R: instantaneous wall radius; R̈: radial wall acceleration; Ṙ: radial wall velocity; σ: interface tension / solid stress; μ_l: dynamic viscosity / absorption coefficient</desc><rect width="1080" height="710" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="150" y="157" width="530" height="126" fill="#263d48" stroke="#405466"/><path d="M270,85 L270,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="270,177 275.0,166.0 265.0,166.0" fill="#ffd39a"/><path d="M355,85 L355,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="355,177 360.0,166.0 350.0,166.0" fill="#ffd39a"/><path d="M440,85 L440,177" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="440,177 445.0,166.0 435.0,166.0" fill="#ffd39a"/><text x="190" y="70" fill="#e8f1f6" font-size="20" text-anchor="start">F(r), Ep, ηabs; pulse g(t), τL</text><path d="M355,166 L355,277" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="355,277 360.0,266.0 350.0,266.0" fill="#82d9ee"/><text x="365" y="225" fill="#e8f1f6" font-size="18" text-anchor="start">z; μa = 1/δabs</text><path d="M355,145 L480,145" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="480,145 469.0,140.0 469.0,150.0" fill="#82d9ee"/><text x="445" y="129" fill="#e8f1f6" font-size="17" text-anchor="start">r, w0</text><text x="165" y="317" fill="#e8f1f6" font-size="19" text-anchor="start">Q&#x27;&#x27;&#x27;(r,z,t) → Dabs → ΔT · absorber / 吸收体</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">p_B,required  ·  pressure at the indicated location</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">p∞  ·  ambient liquid pressure</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">far liquid / 远处液体压力</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">ρ_l  ·  liquid / layer / droplet density</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">R  ·  instantaneous wall radius</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 瞬时壁面半径</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">R̈  ·  radial wall acceleration</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 径向壁面加速度</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">Ṙ  ·  radial wall velocity</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 径向壁面速度</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">σ  ·  interface tension / solid stress</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">interface / 界面张力／固体应力</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">μ_l  ·  dynamic viscosity / absorption coefficient</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">material / 动力黏度／吸收系数</text></g></svg>