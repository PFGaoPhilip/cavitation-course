<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="606" viewBox="0 0 1080 606" role="img"><title>4.3 Why equal total impulse can also fail spatially / 为什么总冲量相同仍可能产生不同的空间响应</title><desc>Λ: modal participation / viscous ratio; π: circle geometry constant; a: droplet radius / film span / acceleration; φ: velocity potential / mode shape; A: area / volume-acceleration coefficient</desc><rect width="1080" height="606" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><rect x="175" y="156" width="395" height="105" fill="#1b3445" stroke="#82d9ee" stroke-width="3"/><path d="M98,175 L172,175" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="172,175 161.0,170.0 161.0,180.0" fill="#ffd39a"/><path d="M98,210 L172,210" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="172,210 161.0,205.0 161.0,215.0" fill="#ffd39a"/><path d="M98,245 L172,245" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="172,245 161.0,240.0 161.0,250.0" fill="#ffd39a"/><path d="M175,277 L570,277" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="570,277 559.0,272.0 559.0,282.0" fill="#82d9ee"/><text x="343" y="306" fill="#e8f1f6" font-size="20" text-anchor="start">L</text><path d="M590,210 L765,210" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="765,210 754.0,205.0 754.0,215.0" fill="#82d9ee"/><text x="610" y="181" fill="#e8f1f6" font-size="20" text-anchor="start">ΔU / Uj</text><text x="90" y="126" fill="#e8f1f6" font-size="18" text-anchor="start">Δp acts for τ · 压差持续 τ</text><text x="225" y="224" fill="#e8f1f6" font-size="20" text-anchor="start">ρ; Ip = ∫Δp dt</text><text x="113" y="343" fill="#e8f1f6" font-size="16" text-anchor="start">Slug speed change ≠ focused bubble jet / 液柱速度变化不等于聚焦泡射流</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">Λ  ·  modal participation / viscous ratio</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">mode / 模态参与／黏性比</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">π  ·  circle geometry constant</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 圆几何常数</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">a  ·  droplet radius / film span / acceleration</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 液滴半径／膜跨度／加速度</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">φ  ·  velocity potential / mode shape</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">field / 速度势／模态形状</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">A  ·  area / volume-acceleration coefficient</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 面积／体积加速度系数</text></g></svg>