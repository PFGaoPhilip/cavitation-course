iable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">χ  ·  confinement / susceptibility</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 约束比／响应率</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">θ  ·  polar coordinate</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 极角坐标</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">R_model  ·  bubble wall radius</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 气泡壁面半径</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">t_i  ·  physical time</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">R_i  ·  bubble wall radius</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 气泡壁面半径</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">s_i  ·  in-plane radial coordinate</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">film / 平面内径向坐标</text></g></svg>