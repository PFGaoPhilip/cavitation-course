<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img"><title>2.2 From one droplet to many droplets / 从单个液滴到液滴群体</title><desc>P_ge1: at least one true event; N: event count / membrane tension; p_1: single-droplet true-event probability</desc><rect width="1080" height="600" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><circle cx="160" cy="205" r="18" fill="#1b3445" stroke="#82d9ee" stroke-width="2"/><circle cx="245" cy="205" r="18" fill="#1b3445" stroke="#82d9ee" stroke-width="2"/><circle cx="355" cy="205" r="40" fill="#1b3445" stroke="#82d9ee" stroke-width="2"/><text x="105" y="265" fill="#e8f1f6" font-size="18" text-anchor="start">r &lt; r*</text><text x="305" y="275" fill="#e8f1f6" font-size="18" text-anchor="start">r &gt; r*</text><path d="M355,205 L395,205" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="395,205 384.0,200.0 384.0,210.0" fill="#82d9ee"/><text x="105" y="100" fill="#e8f1f6" font-size="20" text-anchor="start">Nuclei / droplets in Vobs · 气核／液滴群</text><path d="M520,290 L520,120" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="520,120 515.0,131.0 525.0,131.0" fill="#82d9ee"/><path d="M520,290 L795,290" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="795,290 784.0,285.0 784.0,295.0" fill="#82d9ee"/><path d="M530,285 Q610,90 675,180 Q735,250 780,283" fill="none" stroke="#ffd39a" stroke-width="3"/><text x="545" y="112" fill="#e8f1f6" font-size="17" text-anchor="start">ΔG(r) / event probability</text><text x="641" y="175" fill="#e8f1f6" font-size="17" text-anchor="start">r*, ΔG*</text><text x="710" y="319" fill="#e8f1f6" font-size="16" text-anchor="start">r / dose</text><text x="110" y="319" fill="#e8f1f6" font-size="16" text-anchor="start">J, p1, N, qd, fd, P · occurrence ≠ detection / 发生与检测不同</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">P_ge1  ·  at least one true event</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">population / 至少一个真实事件</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">N  ·  event count / membrane tension</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">population / 事件数／膜张力</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">p_1  ·  single-droplet true-event probability</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">droplet / 单液滴真实事件概率</text></g></svg>