<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="606" viewBox="0 0 1080 606" role="img"><title>4.4 Deriving first-arrival wave transmission / 推导首波传输</title><desc>ρ: liquid / layer / droplet density; u: liquid or solid particle velocity; t: physical time; σ_zz: interface tension / solid stress; z: depth / formulation predictor; M_L: generalized mass / molar mass</desc><rect width="1080" height="606" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><path d="M110,95 L110,306" stroke="#82d9ee" stroke-width="2.5" fill="none"/><path d="M375,95 L375,306" stroke="#82d9ee" stroke-width="2.5" fill="none"/><path d="M640,95 L640,306" stroke="#82d9ee" stroke-width="2.5" fill="none"/><path d="M185,182 L348,182" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="348,182 337.0,177.0 337.0,187.0" fill="#82d9ee"/><path d="M435,182 L612,182" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="612,182 601.0,177.0 601.0,187.0" fill="#82d9ee"/><path d="M290,231 L158,231" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="158,231 169.0,236.0 169.0,226.0" fill="#82d9ee"/><text x="150" y="145" fill="#e8f1f6" font-size="18" text-anchor="start">pi, Z1 = ρ1 c1</text><text x="421" y="145" fill="#e8f1f6" font-size="18" text-anchor="start">pt, Z2 = ρ2 c2</text><text x="165" y="273" fill="#e8f1f6" font-size="18" text-anchor="start">pr</text><path d="M375,292 L640,292" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="640,292 629.0,287.0 629.0,297.0" fill="#82d9ee"/><text x="462" y="318" fill="#e8f1f6" font-size="18" text-anchor="start">h2, h2/c2</text><text x="95" y="75" fill="#e8f1f6" font-size="20" text-anchor="start">Wave arrival and transmission / 波到达与透射</text><text x="670" y="211" fill="#e8f1f6" font-size="17" text-anchor="start">p(r,t−r/c)</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">ρ  ·  liquid / layer / droplet density</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">u  ·  liquid or solid particle velocity</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">motion / 液体或固体质点速度</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">t  ·  physical time</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">clock / 物理时间</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">σ_zz  ·  interface tension / solid stress</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">interface / 界面张力／固体应力</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">z  ·  depth / formulation predictor</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">depth / 深度／配方预测量</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">M_L  ·  generalized mass / molar mass</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">mass / 广义质量／摩尔质量</text></g></svg>