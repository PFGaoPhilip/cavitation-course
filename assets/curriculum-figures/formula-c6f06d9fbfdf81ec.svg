<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img"><title>Phase-change perfluorocarbon droplets · original governing laws</title><desc>m_PF: mass or areal mass; ρ_d: liquid / layer / droplet density; π: circle geometry constant; a_0: droplet radius / film span / acceleration; p_PF: pressure at the indicated location; V_b: bubble or observation volume; R_u: bubble wall radius; T: temperature / kinetic energy as defined; M: generalized mass / molar mass</desc><rect width="1080" height="710" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><circle cx="300" cy="205" r="104" fill="#244453" stroke="#82d9ee" stroke-width="3"/><circle cx="333" cy="184" r="30" fill="#102733" stroke="#ffd39a" stroke-width="3"/><path d="M300,205 L404,205" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="404,205 393.0,200.0 393.0,210.0" fill="#82d9ee"/><text x="360" y="241" fill="#e8f1f6" font-size="16" text-anchor="start">a · outer radius / 外半径</text><path d="M333,184 L363,184" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="363,184 352.0,179.0 352.0,189.0" fill="#82d9ee"/><text x="340" y="155" fill="#e8f1f6" font-size="16" text-anchor="start">r · embryo / 胚核</text><text x="450" y="180" fill="#e8f1f6" font-size="16" text-anchor="start">σdw, Πshell · outer interface / 外界面</text><text x="450" y="225" fill="#e8f1f6" font-size="16" text-anchor="start">σvd · inner interface / 内界面</text><text x="135" y="324" fill="#e8f1f6" font-size="18" text-anchor="start">md, ρd, M → vapor inventory pPF Vb / 蒸气存量</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">m_PF  ·  mass or areal mass</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">mass / 质量或面密度</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">ρ_d  ·  liquid / layer / droplet density</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">π  ·  circle geometry constant</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 圆几何常数</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">a_0  ·  droplet radius / film span / acceleration</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 液滴半径／膜跨度／加速度</text><text x="35" y="633" fill="#e8f1f6" font-size="15" text-anchor="start">p_PF  ·  pressure at the indicated location</text><text x="35" y="654" fill="#b1c2cf" font-size="14" text-anchor="start">pressure / 指定位置压力</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">V_b  ·  bubble or observation volume</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">volume / 气泡或观测体积</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">R_u  ·  bubble wall radius</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 气泡壁面半径</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">T  ·  temperature / kinetic energy as defined</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 按定义为温度／动能</text><text x="550" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">M  ·  generalized mass / molar mass</text><text x="550" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">mass / 广义质量／摩尔质量</text></g></svg>