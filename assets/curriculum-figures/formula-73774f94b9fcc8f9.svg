<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="658" viewBox="0 0 1080 658" role="img"><title>Gas, vapor, heat and mass · original governing laws</title><desc>p_g: noncondensable gas pressure; p_g0: reference gas pressure; R_0: reference equilibrium radius; R: instantaneous wall radius; κ: gas polytropic exponent / curvature; T_g: temperature / kinetic energy as defined; T_g0: temperature / kinetic energy as defined</desc><rect width="1080" height="658" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><circle cx="280" cy="210" r="85" fill="#1b3445" stroke="#82d9ee" stroke-width="3"/><path d="M280,210 L365,210" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="365,210 354.0,205.0 354.0,215.0" fill="#82d9ee"/><text x="292" y="200" fill="#e8f1f6" font-size="16" text-anchor="start">R(t) · wall / 壁面</text><text x="225" y="255" fill="#e8f1f6" font-size="18" text-anchor="start">pB = pg + pv</text><path d="M373,220 L427,220" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="427,220 416.0,215.0 416.0,225.0" fill="#82d9ee"/><text x="377" y="255" fill="#e8f1f6" font-size="19" text-anchor="start">Ṙ, R̈</text><text x="140" y="95" fill="#e8f1f6" font-size="20" text-anchor="start">Gas / vapor · 气体／蒸气</text><path d="M490,180 L374,180" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="374,180 385.0,185.0 385.0,175.0" fill="#ffd39a"/><path d="M270,135 L270,179" stroke="#ffd39a" stroke-width="2.5" fill="none"/><polygon points="270,179 275.0,168.0 265.0,168.0" fill="#ffd39a"/><text x="415" y="160" fill="#e8f1f6" font-size="18" text-anchor="start">qL→i</text><text x="220" y="120" fill="#e8f1f6" font-size="18" text-anchor="start">qV→i</text><text x="470" y="240" fill="#e8f1f6" font-size="17" text-anchor="start">j Lv · phase exchange / 相变</text><text x="440" y="278" fill="#e8f1f6" font-size="18" text-anchor="start">ρL, ρV; Ti; Tg; κ</text><text x="75" y="318" fill="#e8f1f6" font-size="16" text-anchor="start">Interface normal points into liquid / 法向指向液体</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">p_g  ·  noncondensable gas pressure</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">gas / 不凝性气体压力</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">p_g0  ·  reference gas pressure</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">gas / 参考气体压力</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">R_0  ·  reference equilibrium radius</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">reference / 参考平衡半径</text><text x="35" y="581" fill="#e8f1f6" font-size="15" text-anchor="start">R  ·  instantaneous wall radius</text><text x="35" y="602" fill="#b1c2cf" font-size="14" text-anchor="start">wall / 瞬时壁面半径</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">κ  ·  gas polytropic exponent / curvature</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">closure / 气体多方指数／曲率</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">T_g  ·  temperature / kinetic energy as defined</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 按定义为温度／动能</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">T_g0  ·  temperature / kinetic energy as defined</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">energy / 按定义为温度／动能</text></g></svg>