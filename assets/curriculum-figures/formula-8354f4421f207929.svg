<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="606" viewBox="0 0 1080 606" role="img"><title>6.1 Linearization around equilibrium / 平衡态附近的线性化</title><desc>f_0: frequency / predictor / false detections; π: circle geometry constant; R_0: reference equilibrium radius; κ: gas polytropic exponent / curvature; p_0: reference ambient pressure; ρ: liquid / layer / droplet density</desc><rect width="1080" height="606" fill="#101b26"/><g font-family="Arial, Microsoft YaHei, sans-serif"><circle cx="235" cy="205" r="70" fill="#1b3445" stroke="#82d9ee" stroke-width="3"/><path d="M235,205 L305,205" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="305,205 294.0,200.0 294.0,210.0" fill="#82d9ee"/><text x="247" y="195" fill="#e8f1f6" font-size="16" text-anchor="start">R(t) · wall / 壁面</text><text x="180" y="250" fill="#e8f1f6" font-size="18" text-anchor="start">pB = pg + pv</text><path d="M313,215 L367,215" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="367,215 356.0,210.0 356.0,220.0" fill="#82d9ee"/><text x="317" y="250" fill="#e8f1f6" font-size="19" text-anchor="start">Ṙ, R̈</text><path d="M305,205 L400,205" stroke="#82d9ee" stroke-width="2.5" fill="none"/><polygon points="400,205 389.0,200.0 389.0,210.0" fill="#82d9ee"/><text x="360" y="177" fill="#e8f1f6" font-size="18" text-anchor="start">R = R0(1+x)</text><rect x="585" y="160" width="115" height="85" fill="#244453" stroke="#82d9ee"/><path d="M435,205 L465,205 L476,178 L497,232 L518,178 L539,232 L549,205 L585,205" fill="none" stroke="#ffd39a" stroke-width="3"/><text x="453" y="145" fill="#e8f1f6" font-size="17" text-anchor="start">Gas stiffness / 气体刚度</text><text x="595" y="211" fill="#e8f1f6" font-size="20" text-anchor="start">MR</text><text x="450" y="284" fill="#e8f1f6" font-size="18" text-anchor="start">βμ + βthermal + βradiation</text><text x="125" y="330" fill="#e8f1f6" font-size="17" text-anchor="start">Radial oscillation and its mechanics analogy / 径向振荡与力学类比</text><path d="M35,370 L1045,370" stroke="#405466"/><text x="35" y="395" fill="#e8f1f6" font-size="18" text-anchor="start">Variable locations and roles / 变量位置与作用</text><text x="35" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">f_0  ·  frequency / predictor / false detections</text><text x="35" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">measurement / 频率／预测函数／误报</text><text x="35" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">π  ·  circle geometry constant</text><text x="35" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">geometry / 圆几何常数</text><text x="35" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">R_0  ·  reference equilibrium radius</text><text x="35" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">reference / 参考平衡半径</text><text x="550" y="425" fill="#e8f1f6" font-size="15" text-anchor="start">κ  ·  gas polytropic exponent / curvature</text><text x="550" y="446" fill="#b1c2cf" font-size="14" text-anchor="start">closure / 气体多方指数／曲率</text><text x="550" y="477" fill="#e8f1f6" font-size="15" text-anchor="start">p_0  ·  reference ambient pressure</text><text x="550" y="498" fill="#b1c2cf" font-size="14" text-anchor="start">far liquid / 参考环境压力</text><text x="550" y="529" fill="#e8f1f6" font-size="15" text-anchor="start">ρ  ·  liquid / layer / droplet density</text><text x="550" y="550" fill="#b1c2cf" font-size="14" text-anchor="start">material / 液体／层／液滴密度</text></g></svg>