<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Kinetic-energy integration over surrounding liquid shells</title>
<desc>A spherical shell at r with thickness dr carries liquid density rho and speed u; integration begins at bubble radius R and extends outward.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="290" cy="230" r="78" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<circle cx="290" cy="230" r="161" fill="none" stroke="#8fb8ff" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="290" cy="230" r="177" fill="none" stroke="#8fb8ff" stroke-width="2" stroke-dasharray="4 7"/>
<line x1="290" y1="230" x2="368" y2="230" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="332" y="263" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#6dd6e7">R</text>
<line x1="290" y1="230" x2="451" y2="230" stroke="#8fb8ff" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="443" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#8fb8ff">r</text>
<line x1="452" y1="335" x2="467" y2="335" stroke="#c5a4f7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-purple)"/>
<text x="477" y="337" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">dr</text>
<line x1="369" y1="185" x2="416" y2="185" stroke="#6dd6e7" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="60" y="118" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">Ṙ</text>
<text x="60" y="143" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">wall speed / 壁面速度</text>
<line x1="452" y1="178" x2="482" y2="178" stroke="#8fb8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="545" y="128" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">u(r,t)</text>
<text x="545" y="153" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">liquid speed / 液体速度</text>
<text x="616" y="207" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#b1c2cf">ρ</text>
<text x="616" y="232" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">liquid density / 液体密度</text>
<rect x="572" y="270" width="360" height="118" rx="10" fill="#2c2741" stroke="#6b5a86" stroke-width="2"/>
<text x="598" y="309" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">T</text>
<text x="598" y="334" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">all-shell kinetic energy / 所有液层总动能</text>
<text x="598" y="367" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="normal" fill="#b1c2cf">R → ∞ : sum 4πr²dr shells</text>
</svg>
