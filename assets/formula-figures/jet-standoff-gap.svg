<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
<title id="title">Stand-off ratio and initial geometric gap / 离壁比与初始几何间隙</title>
<desc id="desc">Maximum bubble radius R_max extends from center to bubble edge. Center-to-boundary distance h includes radius plus initial gap g, so g equals h minus R_max. / 最大半径 R_max 从泡心延伸至泡壁；泡心至边界距离 h 包含半径与初始间隙 g，因此 g 等于 h 减 R_max。</desc>
<rect width="920" height="350" rx="18" fill="#142330"/>
<text x="27" y="39" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="21">At maximum size and an undeformed plane / 最大泡径与未变形平面</text>
<circle cx="305" cy="185" r="99" fill="#0b141e" stroke="#82d9ee" stroke-width="4"/>
<circle cx="305" cy="185" r="4" fill="#e8f1f6"/>
<line x1="454" y1="67" x2="454" y2="300" stroke="#ffd39a" stroke-width="7"/>
<text x="495" y="105" fill="#ffd39a" font-family="Arial,sans-serif" font-size="19">boundary / 边界</text>
<line x1="305" y1="185" x2="404" y2="185" stroke="#82d9ee" stroke-width="3"/>
<text x="331" y="173" fill="#82d9ee" font-family="Arial,sans-serif" font-size="22">Rₘₐₓ</text>
<line x1="305" y1="67" x2="454" y2="67" stroke="#c5a4f7" stroke-width="3"/>
<line x1="305" y1="58" x2="305" y2="76" stroke="#c5a4f7" stroke-width="2"/>
<line x1="454" y1="58" x2="454" y2="76" stroke="#c5a4f7" stroke-width="2"/>
<text x="368" y="61" fill="#c5a4f7" font-family="Arial,sans-serif" font-size="20">h</text>
<line x1="404" y1="226" x2="454" y2="226" stroke="#ef91bf" stroke-width="3"/>
<line x1="404" y1="217" x2="404" y2="235" stroke="#ef91bf" stroke-width="2"/>
<line x1="454" y1="217" x2="454" y2="235" stroke="#ef91bf" stroke-width="2"/>
<text x="418" y="259" fill="#ef91bf" font-family="Arial,sans-serif" font-size="22">g</text>
<text x="532" y="174" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="18">h = Rₘₐₓ + g</text>
<text x="532" y="205" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="18">γₛ = h/Rₘₐₓ</text>
<text x="533" y="250" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="16">geometry only / 仅为几何量</text>
</svg>
