<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">Conditional jet impact scales and separate shock / 条件性射流冲击尺度与独立冲击波</title>
<desc id="desc">A measured cylindrical jet of diameter d_j and speed U_j approaches a target with area A and may create a steady momentum-flux force; a distinct bubble-collapse shock can arrive at another time. / 已测量直径 d_j、速度 U_j 的圆柱射流接近面积 A 的靶面，可产生稳态动量通量力；另外的气泡塌缩冲击波可能在不同时间到达。</desc>
<defs><marker id="k" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#ef91bf" stroke-width="1.6"/></marker></defs>
<rect width="920" height="360" rx="18" fill="#142330"/>
<text x="30" y="39" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="21">Jet flow scale is not a measured peak wall load / 射流流动尺度不等于实测峰值壁面载荷</text>
<path d="M435 82 L485 82 L485 265 L435 265 Z" fill="#1b4055" stroke="#82d9ee" stroke-width="3"/>
<line x1="460" y1="125" x2="460" y2="231" stroke="#ef91bf" stroke-width="4" marker-end="url(#k)"/>
<text x="510" y="161" fill="#ef91bf" font-family="Arial,sans-serif" font-size="22">Uⱼ</text>
<text x="515" y="203" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="19">ρ</text>
<line x1="435" y1="68" x2="485" y2="68" stroke="#ffd39a" stroke-width="2"/>
<text x="446" y="58" fill="#ffd39a" font-family="Arial,sans-serif" font-size="19">dⱼ</text>
<rect x="260" y="267" width="400" height="22" fill="#ffd39a"/>
<text x="507" y="319" fill="#ffd39a" font-family="Arial,sans-serif" font-size="18">target / 靶面</text>
<text x="516" y="225" fill="#82d9ee" font-family="Arial,sans-serif" font-size="18">jet area Aⱼ</text>
<text x="516" y="247" fill="#82d9ee" font-family="Arial,sans-serif" font-size="16">射流截面积 Aⱼ</text>
<path d="M625 80 A80 80 0 0 1 678 171" fill="none" stroke="#b1c2cf" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M665 73 A105 105 0 0 1 738 185" fill="none" stroke="#b1c2cf" stroke-width="3" stroke-dasharray="8 5"/>
<text x="685" y="95" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="16">separate shock / 独立冲击波</text>
<text x="75" y="190" fill="#82d9ee" font-family="Arial,sans-serif" font-size="18">q: flow pressure scale</text>
<text x="75" y="213" fill="#82d9ee" font-family="Arial,sans-serif" font-size="18">q：流动压力尺度</text>
<text x="75" y="246" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="17">F: steady redirection only</text>
<text x="75" y="268" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="17">F：仅稳态转向估计</text>
</svg>
