<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Fixed gas compressed from R_0 to R</title>
<desc>The same gas occupies a smaller bubble: gas pressure rises according to the chosen polytropic exponent kappa. Vapor can be held at constant pressure separately.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="245" cy="227" r="123" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<circle cx="712" cy="227" r="95" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<text x="245" y="160" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="bold" fill="#c5a4f7">p_g0</text>
<text x="712" y="181" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="bold" fill="#c5a4f7">p_g(R)</text>
<line x1="245" y1="227" x2="368" y2="227" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="335" y="264" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#6dd6e7">R_0</text>
<line x1="712" y1="227" x2="807" y2="227" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="790" y="265" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#6dd6e7">R</text>
<line x1="405" y1="224" x2="602" y2="224" stroke="#c5a4f7" stroke-width="5" stroke-linecap="round" marker-end="url(#a-purple)"/>
<text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">κ</text>
<text x="500" y="125" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">gas-process exponent / 气体过程指数</text>
<text x="500" y="285" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#b1c2cf">same gas / 同一份气体</text>
<text x="245" y="348" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">p_v</text>
<text x="245" y="373" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">vapor pressure / 蒸气压</text>
<text x="712" y="348" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">p_v</text>
<text x="712" y="373" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">held constant / 近似恒定</text>
<text x="815" y="81" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">p_B(R)</text>
<text x="815" y="106" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">total inside / 泡内总压</text>
<line x1="798" y1="111" x2="767" y2="146" stroke="#c5a4f7" stroke-width="2" stroke-linecap="round"/>
<text x="713" y="411" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#b1c2cf">p_B(R) = gas + vapor / 泡内总压 = 气体 + 蒸气</text>
</svg>
