<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Concentric surfaces in spherical liquid flow</title>
<desc>R is the bubble wall; r is an outer liquid sphere. Wall speed and radial liquid velocity are marked at their locations.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="305" cy="226" r="93" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<circle cx="305" cy="226" r="180" fill="none" stroke="#8fb8ff" stroke-width="3" stroke-dasharray="8 7"/>
<line x1="305" y1="226" x2="398" y2="226" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="353" y="263" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#6dd6e7">R</text>
<line x1="305" y1="226" x2="485" y2="226" stroke="#8fb8ff" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="468" y="263" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#8fb8ff">r</text>
<line x1="400" y1="185" x2="454" y2="185" stroke="#6dd6e7" stroke-width="5" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="588" y="137" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">Ṙ</text>
<text x="588" y="162" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">wall velocity / 壁面速度</text>
<line x1="570" y1="147" x2="459" y2="182" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round"/>
<line x1="476" y1="318" x2="509" y2="318" stroke="#8fb8ff" stroke-width="5" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="595" y="317" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">u(r,t)</text>
<text x="595" y="342" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">liquid velocity at r / r 处液速</text>
<line x1="579" y1="314" x2="516" y2="318" stroke="#8fb8ff" stroke-width="2" stroke-linecap="round"/>
<text x="95" y="66" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#b1c2cf">t</text>
<text x="95" y="91" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">instant shown / 图示时刻</text>
<rect x="575" y="353" width="355" height="64" rx="10" fill="#1c2f3d" stroke="#405466" stroke-width="2"/>
<text x="600" y="392" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="normal" fill="#e8f1f6">r ↑  ⇒  area ↑  ⇒  u ↓</text>
</svg>
