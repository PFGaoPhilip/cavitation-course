<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Wall speed compared with liquid sound speed</title>
<desc>A bubble wall moves at signed speed R-dot while a disturbance travels through the liquid at sound speed c; their magnitude ratio is the wall Mach number.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="285" cy="230" r="102" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<circle cx="285" cy="230" r="155" fill="none" stroke="#8fb8ff" stroke-width="2" stroke-dasharray="8 8"/>
<circle cx="285" cy="230" r="204" fill="none" stroke="#8fb8ff" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="285" y1="230" x2="387" y2="230" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="330" y="266" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">R</text>
<text x="330" y="291" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">bubble radius / 气泡半径</text>
<line x1="428" y1="191" x2="396" y2="191" stroke="#6dd6e7" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="455" y="146" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">|Ṙ|</text>
<text x="455" y="171" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">wall-speed magnitude / 壁速大小</text>
<line x1="480" y1="338" x2="542" y2="338" stroke="#8fb8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="553" y="333" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">c</text>
<text x="553" y="358" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">sound speed in liquid / 液体声速</text>
<rect x="650" y="84" width="295" height="126" rx="10" fill="#2c2741" stroke="#6b5a86" stroke-width="2"/>
<text x="680" y="132" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">M_w = |Ṙ|/c</text>
<text x="680" y="157" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">wall Mach number / 壁面马赫数</text>
</svg>
