<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">Asymmetric collapse produces a re-entrant jet / 非对称塌缩产生回入射流</title>
<desc id="desc">A bubble near a rigid wall has a faster-moving far-side interface, which indents the bubble and can form a jet toward the wall. / 靠近刚壁的气泡远壁侧界面运动更快，可向内凹陷并形成朝壁面的射流。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#82d9ee" stroke-width="1.6"/></marker></defs>
<rect width="920" height="360" rx="18" fill="#142330"/>
<text x="32" y="39" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="22">A boundary makes the two sides unequal / 边界使两侧运动不等</text>
<line x1="45" y1="295" x2="875" y2="295" stroke="#ffd39a" stroke-width="7"/>
<text x="610" y="329" fill="#ffd39a" font-family="Arial,sans-serif" font-size="17">rigid wall / 刚壁</text>
<path d="M270 93 C350 78 390 151 384 205 C379 261 330 281 268 273 C205 266 171 229 168 186 C166 137 205 102 270 93 Z" fill="#0b141e" stroke="#82d9ee" stroke-width="4"/>
<path d="M602 103 C642 83 682 113 703 144 C722 174 719 219 688 247 C659 271 602 274 574 250 C548 229 554 201 578 178 C594 161 608 154 602 103 Z" fill="#0b141e" stroke="#82d9ee" stroke-width="4"/>
<path d="M610 94 C613 124 605 146 589 173 C582 185 591 211 604 226" fill="none" stroke="#ef91bf" stroke-width="6" marker-end="url(#a)"/>
<line x1="270" y1="65" x2="270" y2="121" stroke="#82d9ee" stroke-width="4" marker-end="url(#a)"/>
<text x="160" y="72" fill="#82d9ee" font-family="Arial,sans-serif" font-size="17">far side faster / 远壁侧更快</text>
<line x1="274" y1="286" x2="274" y2="268" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/>
<text x="65" y="255" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="17">near side constrained / 近壁侧受限</text>
<text x="483" y="72" fill="#ef91bf" font-family="Arial,sans-serif" font-size="17">re-entrant jet / 回入射流</text>
<text x="65" y="334" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="15">Sketch of a tendency, not a solved interface or velocity field / 仅示趋势，非求解所得界面或速度场</text>
</svg>
