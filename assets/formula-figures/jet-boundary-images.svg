<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">Boundary type and ideal image-bubble intuition / 边界类型与理想镜像气泡直觉</title>
<desc id="desc">A rigid wall has a same-sign image and tends to draw the collapse jet toward it; a pressure-release free surface has an opposite-sign image and tends to direct the re-entrant jet away; a compliant boundary needs its dynamics. / 刚壁同号镜像通常使塌缩射流朝壁面；自由面异号镜像通常使回入射流背离；柔性边界必须考虑自身动力学。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#ef91bf" stroke-width="1.6"/></marker></defs>
<rect width="920" height="360" rx="18" fill="#142330"/>
<text x="30" y="38" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="21">Same geometry, different boundary response / 几何相同，边界响应不同</text>
<line x1="315" y1="65" x2="315" y2="335" stroke="#405466"/>
<line x1="615" y1="65" x2="615" y2="335" stroke="#405466"/>
<text x="48" y="80" fill="#82d9ee" font-family="Arial,sans-serif" font-size="18">rigid / 刚壁</text>
<text x="350" y="80" fill="#82d9ee" font-family="Arial,sans-serif" font-size="18">free surface / 自由面</text>
<text x="650" y="80" fill="#82d9ee" font-family="Arial,sans-serif" font-size="18">compliant / 柔性边界</text>
<circle cx="160" cy="157" r="43" fill="#0b141e" stroke="#82d9ee" stroke-width="3"/>
<line x1="160" y1="176" x2="160" y2="219" stroke="#ef91bf" stroke-width="4" marker-end="url(#arr)"/>
<line x1="40" y1="245" x2="280" y2="245" stroke="#ffd39a" stroke-width="6"/>
<circle cx="160" cy="314" r="38" fill="none" stroke="#b1c2cf" stroke-dasharray="7 6" stroke-width="2"/>
<text x="174" y="314" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="15">same sign / 同号</text>
<circle cx="460" cy="157" r="43" fill="#0b141e" stroke="#82d9ee" stroke-width="3"/>
<line x1="460" y1="176" x2="460" y2="108" stroke="#ef91bf" stroke-width="4" marker-end="url(#arr)"/>
<path d="M340 245 Q370 238 400 245 T460 245 T520 245 T580 245" fill="none" stroke="#ffd39a" stroke-width="5"/>
<circle cx="460" cy="314" r="38" fill="none" stroke="#b1c2cf" stroke-dasharray="7 6" stroke-width="2"/>
<text x="475" y="314" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="15">opposite / 异号</text>
<circle cx="760" cy="157" r="43" fill="#0b141e" stroke="#82d9ee" stroke-width="3"/>
<path d="M640 245 Q690 230 730 245 T820 245 T880 245" fill="none" stroke="#ffd39a" stroke-width="6"/>
<text x="685" y="289" fill="#b1c2cf" font-family="Arial,sans-serif" font-size="16">motion + timing / 位移与相位</text>
<text x="61" y="230" fill="#ef91bf" font-family="Arial,sans-serif" font-size="16">toward / 朝向</text>
<text x="478" y="111" fill="#ef91bf" font-family="Arial,sans-serif" font-size="16">away / 背离</text>
</svg>
