<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Radius-dependent effective radial mass</title>
<desc>The bubble wall at radius R moves with Ṙ. Density rho and distributed radial liquid motion determine energy-equivalent mass M_R and kinetic energy T.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="300" cy="230" r="89" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<circle cx="300" cy="230" r="142" fill="none" stroke="#405466" stroke-width="2" stroke-dasharray="7 8"/>
<circle cx="300" cy="230" r="197" fill="none" stroke="#405466" stroke-width="2" stroke-dasharray="7 8"/>
<line x1="300" y1="230" x2="389" y2="230" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="345" y="265" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">R</text>
<text x="345" y="290" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">bubble radius / 气泡半径</text>
<line x1="390" y1="189" x2="445" y2="189" stroke="#6dd6e7" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="55" y="118" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">Ṙ</text>
<text x="55" y="143" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">radial wall speed / 壁面径向速度</text>
<text x="555" y="93" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">ρ</text>
<text x="555" y="118" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">surrounding liquid / 周围液体</text>
<line x1="555" y1="108" x2="455" y2="157" stroke="#8fb8ff" stroke-width="2" stroke-linecap="round"/>
<rect x="555" y="172" width="385" height="168" rx="10" fill="#1d3345" stroke="#526e83" stroke-width="2"/>
<text x="582" y="219" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">M_R(R)</text>
<text x="582" y="244" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">energy-equivalent radial mass / 径向等效质量</text>
<text x="582" y="295" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">T</text>
<text x="582" y="320" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">kinetic energy of flow / 流场动能</text>
<text x="744" y="399" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="normal" fill="#b1c2cf">distributed radial flow / 分布式径向流动</text>
</svg>
