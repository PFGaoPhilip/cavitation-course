<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">Pressure impulse on an idealized liquid slug / 理想液柱上的压力冲量</title>
<desc id="desc">A pressure difference across a liquid slug of length L and density rho acts for duration tau, changing its speed; sound crosses it with speed c. / 密度为 rho、长度为 L 的液柱受持续 tau 的压差作用而变速，声波以 c 穿过液柱。</desc>
<defs><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#82d9ee" stroke-width="1.6"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#ffd39a" stroke-width="1.6"/></marker></defs>
<rect width="920" height="360" rx="18" fill="#142330"/>
<text x="28" y="39" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="21">Coherent-slug estimate / 整体液柱估计</text>
<rect x="260" y="112" width="400" height="148" fill="#1b4055" stroke="#82d9ee" stroke-width="3"/>
<text x="374" y="185" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="23">liquid / 液体</text>
<text x="402" y="218" fill="#e8f1f6" font-family="Arial,sans-serif" font-size="23">ρ</text>
<line x1="85" y1="185" x2="239" y2="185" stroke="#ffd39a" stroke-width="5" marker-end="url(#o)"/>
<text x="45" y="149" fill="#ffd39a" font-family="Arial,sans-serif" font-size="19">higher p / 高压</text>
<text x="686" y="183" fill="#ffd39a" font-family="Arial,sans-serif" font-size="19">lower p / 低压</text>
<text x="77" y="237" fill="#ffd39a" font-family="Arial,sans-serif" font-size="19">Δp for τ / 压差持续 τ</text>
<text x="77" y="263" fill="#ffd39a" font-family="Arial,sans-serif" font-size="17">I_p = ∫Δp dt</text>
<line x1="260" y1="290" x2="660" y2="290" stroke="#82d9ee" stroke-width="2"/>
<line x1="260" y1="280" x2="260" y2="300" stroke="#82d9ee" stroke-width="2"/>
<line x1="660" y1="280" x2="660" y2="300" stroke="#82d9ee" stroke-width="2"/>
<text x="437" y="319" fill="#82d9ee" font-family="Arial,sans-serif" font-size="22">L</text>
<line x1="322" y1="85" x2="461" y2="85" stroke="#82d9ee" stroke-width="3" marker-end="url(#b)"/>
<text x="319" y="75" fill="#82d9ee" font-family="Arial,sans-serif" font-size="17">wave c; t_a = L/c</text>
<line x1="528" y1="85" x2="670" y2="85" stroke="#ef91bf" stroke-width="3" marker-end="url(#b)"/>
<text x="524" y="75" fill="#ef91bf" font-family="Arial,sans-serif" font-size="17">ΔU_slug / 速度变化</text>
</svg>
