<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Ideal Rayleigh collapse time from maximum radius</title>
<desc>A bubble starts at maximum radius R_max and rest, driven by gap Delta p in liquid density rho; t_c labels elapsed ideal collapse time.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="232" cy="216" r="113" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<circle cx="746" cy="216" r="18" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<line x1="232" y1="216" x2="345" y2="216" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="314" y="251" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">R_max</text>
<text x="314" y="276" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">start radius / 起始最大半径</text>
<line x1="399" y1="216" x2="673" y2="216" stroke="#c5a4f7" stroke-width="5" stroke-linecap="round" marker-end="url(#a-purple)"/>
<text x="530" y="182" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="normal" fill="#c5a4f7">collapse / 塌缩</text>
<text x="232" y="88" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">Δp</text>
<text x="232" y="113" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">inward drive / 向内压差</text>
<line x1="170" y1="112" x2="203" y2="132" stroke="#c5a4f7" stroke-width="4" stroke-linecap="round" marker-end="url(#a-purple)"/>
<text x="747" y="88" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">ρ</text>
<text x="747" y="113" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">liquid inertia / 液体惯性</text>
<line x1="642" y1="111" x2="605" y2="150" stroke="#8fb8ff" stroke-width="2" stroke-linecap="round"/>
<line x1="130" y1="366" x2="845" y2="366" stroke="#8fb8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="492" y="408" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">t_c</text>
<text x="492" y="433" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">ideal elapsed time / 理想历时</text>
<text x="765" y="288" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#b1c2cf">R → 0 in ideal model / 理想模型中趋于零</text>
<text x="232" y="342" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#b1c2cf">Ṙ = 0 at start / 起始壁速为零</text>
</svg>
