<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Pressure-step example for a resting five-micrometer bubble</title>
<desc>p_B remains 129.8 kPa inside; p_infinity outside drops from 101 to 91 kPa. Surface tension at radius 5 micrometers requires 28.8 kPa, leaving D=+10 kPa outward.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="305" cy="228" r="104" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<text x="305" y="177" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">p_B</text>
<text x="305" y="202" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">129.8 kPa inside / 泡内</text>
<line x1="305" y1="228" x2="409" y2="228" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="385" y="266" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">R</text>
<text x="385" y="291" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">5 μm / 五微米</text>
<text x="62" y="91" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#f9b77d">σ</text>
<text x="62" y="116" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">0.072 N/m at wall / 壁面张力</text>
<line x1="235" y1="109" x2="267" y2="130" stroke="#f9b77d" stroke-width="2" stroke-linecap="round"/>
<rect x="535" y="70" width="395" height="99" rx="10" fill="#1d3345" stroke="#526e83" stroke-width="2"/>
<text x="565" y="110" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">p_∞</text>
<text x="565" y="135" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">outside: 101 → 91 kPa / 外部压降低</text>
<rect x="535" y="190" width="395" height="90" rx="10" fill="#36291e" stroke="#69533e" stroke-width="2"/>
<text x="565" y="226" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#f9b77d">2σ/R</text>
<text x="565" y="251" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">28.8 kPa at wall / 壁面曲率压</text>
<line x1="448" y1="342" x2="548" y2="342" stroke="#c5a4f7" stroke-width="5" stroke-linecap="round" marker-end="url(#a-purple)"/>
<text x="610" y="342" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">D = +10 kPa</text>
<text x="610" y="367" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">initial outward surplus / 初始净向外压差</text>
</svg>
