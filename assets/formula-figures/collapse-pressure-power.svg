<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Pressure power becomes liquid kinetic-energy rate</title>
<desc>At radius R, inward pressure gap Delta p reduces bubble volume V while liquid density rho and wall speed Ṙ determine radial kinetic energy T.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<circle cx="310" cy="223" r="100" fill="#1b3941" stroke="#6dd6e7" stroke-width="3"/>
<line x1="310" y1="223" x2="410" y2="223" stroke="#6dd6e7" stroke-width="2" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="391" y="260" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">R</text>
<text x="310" y="182" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">V</text>
<text x="310" y="207" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">bubble volume / 气泡体积</text>
<line x1="527" y1="190" x2="447" y2="190" stroke="#c5a4f7" stroke-width="4" stroke-linecap="round" marker-end="url(#a-purple)"/>
<text x="585" y="165" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">Δp</text>
<text x="585" y="190" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">inward drive / 向内压差</text>
<line x1="510" y1="289" x2="444" y2="289" stroke="#6dd6e7" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="614" y="292" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">Ṙ</text>
<text x="614" y="317" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">inward wall speed / 向内壁速</text>
<text x="107" y="89" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">ρ</text>
<text x="107" y="114" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">surrounding liquid / 周围液体</text>
<rect x="566" y="330" width="363" height="75" rx="10" fill="#1d3345" stroke="#526e83" stroke-width="2"/>
<text x="590" y="368" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#8fb8ff">T</text>
<text x="590" y="393" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">liquid kinetic energy / 液体动能</text>
<text x="321" y="411" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="normal" fill="#b1c2cf">−Δp·dV/dt → dT/dt / 压力功率转入动能</text>
</svg>
