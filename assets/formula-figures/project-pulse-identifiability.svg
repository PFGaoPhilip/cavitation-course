<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<title>Dose, peak rate, and pulse-width identifiability</title>
<desc>For a fixed Gaussian pulse shape, peak deposited power density equals a constant times local dose divided by pulse FWHM; two pulses can have equal dose but different peak rates, yet three log covariates remain algebraically dependent.</desc>
<defs><marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#6dd6e7"/></marker><marker id="a-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#8fb8ff"/></marker><marker id="a-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#f9b77d"/></marker><marker id="a-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#c5a4f7"/></marker></defs>
<rect x="1" y="1" width="998" height="458" rx="14" fill="#12202b" stroke="#405466"/>
<rect x="60" y="78" width="880" height="300" rx="10" fill="#1b2c39" stroke="#405466" stroke-width="2"/>
<line x1="105" y1="321" x2="877" y2="321" stroke="#8fb8ff" stroke-width="2" stroke-linecap="round"/>
<line x1="105" y1="321" x2="105" y2="127" stroke="#8fb8ff" stroke-width="2" stroke-linecap="round"/>
<path d="M130 320 C170 316 185 132 240 132 C295 132 310 316 350 320" fill="none" stroke="#6dd6e7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M420 320 C490 317 530 225 640 225 C750 225 790 317 860 320" fill="none" stroke="#f9b77d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="112" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#6dd6e7">short τ_L</text>
<text x="240" y="137" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">higher q&#x27;&#x27;&#x27;_max / 较高峰值</text>
<text x="640" y="207" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#f9b77d">long τ_L</text>
<text x="640" y="232" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">lower q&#x27;&#x27;&#x27;_max / 较低峰值</text>
<text x="495" y="366" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="bold" fill="#c5a4f7">same D_abs</text>
<text x="495" y="391" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">equal pulse area / 面积相同</text>
<text x="501" y="61" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="normal" fill="#e8f1f6">q&#x27;&#x27;&#x27;_max = C D_abs / τ_L for one Gaussian pulse family</text>
<text x="500" y="424" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="normal" fill="#b1c2cf">D_ref, q_ref, τ_ref: chosen normalization references / 选定的归一化参考量</text>
</svg>
