<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Loaded film/PVC and release interface</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Layer f: thickness t_f, E_f, ν_f, ρ_f</text><text x="60" y="155" font-size="18">Normal displacement w; bending D_f</text><text x="60" y="184" font-size="18">Liquid/other-side pressure difference Δp_n</text><text x="60" y="213" font-size="18">Release opening δ; opposing traction t_coh</text><text x="60" y="242" font-size="18">Separate layers for PVC and transferred film</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">∇_∥: in-plane derivative</text><text x="575" y="117" font-size="17">Γ_sep: separation work [J/m²]</text><text x="575" y="146" font-size="17">δ_c: complete-separation opening</text><text x="575" y="175" font-size="17">t_coh: cohesive normal traction [Pa]</text><text x="575" y="204" font-size="17">w positive in the pressure-loading direction</text><text x="575" y="233" font-size="17">Large slope/stretching needs shell/solid FSI</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>