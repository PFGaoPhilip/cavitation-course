<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">PFH saturation reference and temperature domain</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Planar equilibrium interface at temperature T</text><text x="60" y="155" font-size="18">Species: perfluoro-n-hexane, C6F14</text><text x="60" y="184" font-size="18">Saturation pressure p_sat above interface</text><text x="60" y="213" font-size="18">A, B, C selected from one complete dataset</text><text x="60" y="242" font-size="18">No nanodroplet activation threshold inferred</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">T and C: kelvin; B: kelvin</text><text x="575" y="117" font-size="17">A: dimensionless coefficient</text><text x="575" y="146" font-size="17">p_sat/(1 bar): dimensionless argument</text><text x="575" y="175" font-size="17">Use only the dataset temperature interval</text><text x="575" y="204" font-size="17">1 bar = 100000 Pa</text><text x="575" y="233" font-size="17">Curvature/shell/kinetics require extra closure</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>