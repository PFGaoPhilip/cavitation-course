<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Pressure observer and film load</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Liquid pressure p(x,s); reference p_ref</text><text x="60" y="155" font-size="18">Observer area A_o, time filter g</text><text x="60" y="184" font-size="18">Film wetted area A_f; outward film normal n_f</text><text x="60" y="213" font-size="18">Liquid stress T_l acts on film</text><text x="60" y="242" font-size="18">Force F_f then integrates to impulse ℐ_f</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">g: normalized averaging kernel [1/s]</text><text x="575" y="117" font-size="17">p_obs: spatial/time averaged increment [Pa]</text><text x="575" y="146" font-size="17">s: integration time; t: observation time</text><text x="575" y="175" font-size="17">F_f: liquid force on receiver [N]</text><text x="575" y="204" font-size="17">ℐ_f: incremental receiver impulse [N s]</text><text x="575" y="233" font-size="17">F_ref: pre-event liquid force</text><text x="575" y="262" font-size="17">t_0, t_1: declared event window</text><text x="575" y="291" font-size="17">Peak location/area/time fixed on refinement</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>