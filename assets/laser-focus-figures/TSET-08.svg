<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Gel reference configuration and cavity boundary</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Reference solid: ρ_s0, displacement d</text><text x="60" y="155" font-size="18">Deformation gradient F; volume ratio J</text><text x="60" y="184" font-size="18">Elastic energy density W: G, K</text><text x="60" y="213" font-size="18">Cavity traction and heat act at inner face</text><text x="60" y="242" font-size="18">External support acts at outer boundary</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">G: shear modulus; K: bulk modulus [Pa]</text><text x="575" y="117" font-size="17">Ī_1: isochoric strain invariant</text><text x="575" y="146" font-size="17">P: first Piola stress [Pa]</text><text x="575" y="175" font-size="17">Div: reference-space divergence</text><text x="575" y="204" font-size="17">d̈: solid acceleration</text><text x="575" y="233" font-size="17">F = I + Grad d; Grad in reference space</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>