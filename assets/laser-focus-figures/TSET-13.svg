<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Defined jet mass and available energy</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Jet region Ω_j carries mass m_j</text><text x="60" y="155" font-size="18">Local liquid velocity u varies within it</text><text x="60" y="184" font-size="18">Density ρ defines mass-weighted U_rms</text><text x="60" y="213" font-size="18">E_j: measured/modelled kinetic energy</text><text x="60" y="242" font-size="18">E_available from the complete energy ledger</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">Ω_j: declared tracked liquid region</text><text x="575" y="117" font-size="17">U_rms: mass-weighted RMS speed [m/s]</text><text x="575" y="146" font-size="17">E_available: bounded supplied/stored energy [J]</text><text x="575" y="175" font-size="17">m_j must remain nonzero in comparison</text><text x="575" y="204" font-size="17">A bound is not achieved performance</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>