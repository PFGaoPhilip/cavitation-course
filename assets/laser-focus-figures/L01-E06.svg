<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><circle cx="318" cy="159" r="87" fill="#254658" stroke="#82d9ee" stroke-width="2"/><text x="269" y="140" font-size="19" fill="#e8f1f6">p_g + p_v</text><line x1="318" y1="159" x2="402" y2="159" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="346" y="186" font-size="19" fill="#e8f1f6">R</text><line x1="406" y1="112" x2="474" y2="73" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="483" y="72" font-size="19" fill="#e8f1f6">Ṙ, R̈: outward positive</text><line x1="595" y1="157" x2="425" y2="157" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="606" y="151" font-size="19" fill="#e8f1f6">p_∞: ambient liquid</text><text x="600" y="198" font-size="19" fill="#e8f1f6">ρ: surrounding liquid</text><text x="600" y="227" font-size="19" fill="#e8f1f6">μ: liquid viscosity</text><text x="75" y="275" font-size="18" fill="#e8f1f6">2σ/R: capillary stress at interface</text><text x="475" y="275" font-size="18" fill="#e8f1f6">4μṘ/R: viscous radial stress</text><text x="75" y="307" font-size="17" fill="#e8f1f6">Left-hand side is liquid inertia. A radius-only model has no jet direction.</text></g></svg>