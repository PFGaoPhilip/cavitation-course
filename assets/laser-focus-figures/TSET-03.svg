<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Phase interface and open bubble energy</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Vapor cavity: R, V_b, U_b, p_b, m_v</text><text x="60" y="155" font-size="18">Liquid outside: remaining species mass m_l</text><text x="60" y="184" font-size="18">Γ_s: actual contact surface for species s</text><text x="60" y="213" font-size="18">n points liquid → vapor at the interface</text><text x="60" y="242" font-size="18">q_l enters; q_v leaves the interface</text><text x="60" y="271" font-size="18">Positive j_m adds vapor; h_v accompanies it</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">L_v = h_v − h_l: phase enthalpy [J/kg]</text><text x="575" y="117" font-size="17">Q̇_b: heat excluding carried mass enthalpy</text><text x="575" y="146" font-size="17">Ṙ: interface speed, outward positive</text><text x="575" y="175" font-size="17">m_tot: closed control species inventory</text><text x="575" y="204" font-size="17">V̇_b: volume-change rate [m³/s]</text><text x="575" y="233" font-size="17">U̇_b: bubble internal-energy rate [W]</text><text x="575" y="262" font-size="17">j_m, j_s: mass flux [kg/(m² s)]</text><text x="575" y="291" font-size="17">ṁ_v,s|phase: phase exchange only [kg/s]</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>