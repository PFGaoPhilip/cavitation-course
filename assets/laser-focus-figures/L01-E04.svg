<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><rect x="55" y="60" width="330" height="190" rx="7" fill="#254658" stroke="#82d9ee"/><rect x="385" y="60" width="490" height="190" rx="7" fill="#284236" stroke="#82d9ee"/><text x="95" y="95" font-size="19" fill="#e8f1f6">Vapor: m_v, p_v, T_b</text><text x="445" y="95" font-size="19" fill="#e8f1f6">Liquid: remaining inventory m_l</text><line x1="385" y1="65" x2="385" y2="248" stroke="#ffce8d" stroke-width="5"/><text x="338" y="39" font-size="19" fill="#e8f1f6">Interface Γ at radius R</text><line x1="559" y1="143" x2="408" y2="143" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="450" y="130" font-size="19" fill="#e8f1f6">q_l · n</text><line x1="357" y1="143" x2="214" y2="143" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="235" y="130" font-size="19" fill="#e8f1f6">q_v · n</text><line x1="438" y1="206" x2="331" y2="206" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="450" y="213" font-size="17" fill="#e8f1f6">n: liquid → vapor</text><text x="85" y="212" font-size="17" fill="#e8f1f6">j_m &gt; 0: evaporation</text><text x="445" y="242" font-size="17" fill="#e8f1f6">m_tot = m_l + m_v (closed species)</text><text x="85" y="292" font-size="18" fill="#e8f1f6">4πR² j_m → vapor mass rate ṁ_v</text><text x="542" y="292" font-size="18" fill="#e8f1f6">L_v: phase-change enthalpy</text></g></svg>