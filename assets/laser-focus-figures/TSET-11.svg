<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Retarded weak-acoustic observation</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Source i at x_i: volume V_i(t)</text><text x="60" y="155" font-size="18">Observer x at distance r_i</text><text x="60" y="184" font-size="18">Carrier density ρ and sound speed c</text><text x="60" y="213" font-size="18">Source time delayed by r_i/c</text><text x="60" y="242" font-size="18">Measured increment p′ at observer</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">V̈_i: source volume acceleration [m³/s²]</text><text x="575" y="117" font-size="17">p′: pressure above reference [Pa]</text><text x="575" y="146" font-size="17">x, x_i: positions; t: time</text><text x="575" y="175" font-size="17">Monopole/weak-wave, distant observer limit</text><text x="575" y="204" font-size="17">No nonlinear shock amplification inferred</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>