<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><circle cx="204" cy="152" r="87" fill="#254658" stroke="#82d9ee" stroke-width="2"/><line x1="204" y1="152" x2="287" y2="152" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="206" y="181" font-size="19" fill="#e8f1f6">R_max</text><text x="98" y="38" font-size="19" fill="#e8f1f6">Initially at rest: Ṙ = 0</text><line x1="321" y1="154" x2="391" y2="154" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><circle cx="447" cy="154" r="31" fill="#254658" stroke="#82d9ee" stroke-width="2"/><text x="408" y="212" font-size="19" fill="#e8f1f6">collapse</text><text x="576" y="84" font-size="19" fill="#e8f1f6">Δp = p_∞ − p_v &gt; 0</text><text x="576" y="121" font-size="19" fill="#e8f1f6">ρ: surrounding liquid</text><text x="576" y="158" font-size="19" fill="#e8f1f6">E_B: ideal pressure-work energy</text><text x="576" y="195" font-size="19" fill="#e8f1f6">t_c: ideal collapse interval</text><text x="576" y="232" font-size="17" fill="#e8f1f6">No ongoing heat or gas cushioning</text><text x="73" y="298" font-size="17" fill="#e8f1f6">Use this as an independent ideal control, not a model of the complete laser exposure.</text></g></svg>