<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Interface energy and capillary storage</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Liquid l → interface Γ → vapor v</text><text x="60" y="155" font-size="18">Interface moves at v_Γ; inward cavity normal n</text><text x="60" y="184" font-size="18">Relative phase velocity w_k = u_k − v_Γ</text><text x="60" y="213" font-size="18">Heat q and viscous power τ enter jump</text><text x="60" y="242" font-size="18">Γ stores σ A_Γ; bulk work supplies area change</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">h_k: enthalpy e_k + p_k/ρ_k [J/kg]</text><text x="575" y="117" font-size="17">j_m: signed through-interface mass flux</text><text x="575" y="146" font-size="17">[[a]]: vapor minus liquid</text><text x="575" y="175" font-size="17">All energy-jump terms have units W/m²</text><text x="575" y="204" font-size="17">A_Γ: actual interface area [m²]</text><text x="575" y="233" font-size="17">E_Γ: stored interface energy [J]</text><text x="575" y="262" font-size="17">∇_s·v_Γ: local area dilation [1/s]</text><text x="575" y="291" font-size="17">w_k: velocity in interface frame [m/s]</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>