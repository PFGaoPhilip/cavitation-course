<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><rect x="49" y="101" width="200" height="94" rx="7" fill="#254658" stroke="#82d9ee"/><text x="70" y="137" font-size="19" fill="#e8f1f6">E_abs: laser input</text><line x1="249" y1="147" x2="341" y2="147" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><rect x="347" y="50" width="530" height="84" rx="7" fill="#254658" stroke="#82d9ee"/><text x="367" y="83" font-size="19" fill="#e8f1f6">m_h c_p ΔT: prescribed sensible heating</text><text x="367" y="114" font-size="17" fill="#e8f1f6">ΔT = T_f − T_i; m_h = heated material mass</text><rect x="347" y="174" width="530" height="83" rx="7" fill="#254658" stroke="#82d9ee"/><text x="367" y="208" font-size="19" fill="#e8f1f6">m_ev L_v: prescribed phase-preparation heat</text><text x="367" y="238" font-size="17" fill="#e8f1f6">m_ev = converted mass; L_v = latent enthalpy</text><text x="50" y="292" font-size="18" fill="#e8f1f6">Q_prep checks thermal sufficiency. It is not a closed jet-energy partition.</text></g></svg>