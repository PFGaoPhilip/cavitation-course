<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Finite population and averaging volume</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Bubbles separated by typical distance d</text><text x="60" y="155" font-size="18">Average box size ℓ_avg contains many bubbles</text><text x="60" y="184" font-size="18">Number density n_b; mean volume ⟨V_b⟩</text><text x="60" y="213" font-size="18">Void fraction φ within averaging box</text><text x="60" y="242" font-size="18">Macro variation length L_macro and edges</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">n_b: bubble number per carrier volume [1/m³]</text><text x="575" y="117" font-size="17">φ: dimensionless gas-volume fraction</text><text x="575" y="146" font-size="17">d: spacing; ℓ_avg: averaging size [m]</text><text x="575" y="175" font-size="17">⟨V_b⟩: local population mean [m³]</text><text x="575" y="204" font-size="17">L_macro: resolved field variation scale [m]</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>