<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Optical path and absorbing control volume</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Incident beam P_in(t), intensity I(z,t)</text><text x="60" y="155" font-size="18">Interception f_geo at beam/target overlap</text><text x="60" y="184" font-size="18">Absorber volume Ω_a: μ_a, Q_abs</text><text x="60" y="213" font-size="18">Entrance absorptance A_λ</text><text x="60" y="242" font-size="18">Heat next enters carrier / PFC / support</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">z: distance along the optical path</text><text x="575" y="117" font-size="17">μ_a: absorption coefficient [1/m]</text><text x="575" y="146" font-size="17">I: intensity [W/m²]</text><text x="575" y="175" font-size="17">Q_abs: volumetric deposition [W/m³]</text><text x="575" y="204" font-size="17">P_abs: absorbed power [W]</text><text x="575" y="233" font-size="17">E_abs: integrated energy [J]</text><text x="575" y="262" font-size="17">t: time; λ: wavelength</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>