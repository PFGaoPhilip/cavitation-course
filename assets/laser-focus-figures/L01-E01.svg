<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><rect x="70" y="35" width="170" height="65" rx="7" fill="#254658" stroke="#82d9ee"/><text x="91" y="62" font-size="19" fill="#e8f1f6">Laser: P_in(t)</text><text x="91" y="88" font-size="17" fill="#e8f1f6">λ: measured source</text><line x1="155" y1="101" x2="155" y2="193" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="202" width="405" height="55" rx="7" fill="#254658" stroke="#82d9ee"/><text x="76" y="235" font-size="19" fill="#e8f1f6">Absorbing ink / film: A_λ</text><circle cx="357" cy="146" r="62" fill="#254658" stroke="#82d9ee" stroke-width="2"/><text x="321" y="141" font-size="19" fill="#e8f1f6">Water /</text><text x="332" y="168" font-size="19" fill="#e8f1f6">PFC</text><text x="210" y="173" font-size="19" fill="#e8f1f6">f_geo</text><line x1="450" y1="216" x2="548" y2="216" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><rect x="559" y="171" width="305" height="89" rx="7" fill="#254658" stroke="#82d9ee"/><text x="575" y="198" font-size="19" fill="#e8f1f6">P_abs = deposited power</text><text x="575" y="226" font-size="19" fill="#e8f1f6">E_abs = time integral</text><line x1="600" y1="121" x2="875" y2="121" stroke="#82d9ee" stroke-width="3"/><line x1="632" y1="126" x2="632" y2="82" stroke="#82d9ee" stroke-width="3"/><line x1="632" y1="82" x2="816" y2="82" stroke="#82d9ee" stroke-width="3"/><line x1="816" y1="82" x2="816" y2="126" stroke="#82d9ee" stroke-width="3"/><text x="648" y="64" font-size="19" fill="#e8f1f6">illumination interval τ</text><text x="865" y="151" font-size="19" fill="#e8f1f6">t</text><text x="70" y="296" font-size="18" fill="#e8f1f6">Light absorbed in a solid is not automatically heat absorbed in the liquid.</text></g></svg>