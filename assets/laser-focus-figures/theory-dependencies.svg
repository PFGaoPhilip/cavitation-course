<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 950" role="img"><title>Dependencies for laser-induced PFC cavitation transfer</title><defs><marker id="dep-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#82d9ee"/></marker></defs><rect width="1300" height="950" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="30" y="43" font-size="28">Theory dependencies: deposition → phase → flow → transfer</text><rect x="30" y="85" width="380" height="144" rx="12" fill="#254658" stroke="#82d9ee"/><text x="47" y="115" font-size="22">1. Laser and absorber</text><text x="47" y="146" font-size="18">P_in(t), λ, spot, μ_a, A_λ</text><text x="47" y="171" font-size="18">Integrate deposition: P_abs, E_abs</text><text x="47" y="196" font-size="18">Bound input; calibrate interception</text><rect x="460" y="85" width="380" height="144" rx="12" fill="#254658" stroke="#82d9ee"/><text x="477" y="115" font-size="22">2. Conjugate heat transport</text><text x="477" y="146" font-size="18">T(x,t), q, k, ρ, c_p; losses</text><text x="477" y="171" font-size="18">Compare diffusion and heating times</text><text x="477" y="196" font-size="18">Temperature reaches actual interfaces</text><rect x="890" y="85" width="380" height="144" rx="12" fill="#254658" stroke="#82d9ee"/><text x="907" y="115" font-size="22">3. Initiation and finite phases</text><text x="907" y="146" font-size="18">Seeds/activation; Γ_s, m_s, j_s</text><text x="907" y="171" font-size="18">Water, PFC and gas kept separately</text><text x="907" y="196" font-size="18">EOS + phase kinetics → p_b</text><path d="M414 157 L455 157" fill="none" stroke="#82d9ee" stroke-width="3" marker-end="url(#dep-arrow)"/><path d="M844 157 L885 157" fill="none" stroke="#82d9ee" stroke-width="3" marker-end="url(#dep-arrow)"/><path d="M1080 233 L1080 319" fill="none" stroke="#82d9ee" stroke-width="3" marker-end="url(#dep-arrow)"/><rect x="890" y="325" width="380" height="144" rx="12" fill="#254658" stroke="#82d9ee"/><text x="907" y="355" font-size="22">4. Nonlinear cavity and waves</text><text x="907" y="386" font-size="18">R, Ṙ, R̈: spherical control</text><text x="907" y="411" font-size="18">Conservative spatial phases for jets</text><text x="907" y="436" font-size="18">Mass, energy, surface work; EOS</text><rect x="460" y="325" width="380" height="144" rx="12" fill="#254658" stroke="#82d9ee"/><text x="477" y="355" font-size="22">5. Shape and load pathways</text><text x="477" y="386" font-size="18">Boundary asymmetry + neighbors</text><text x="477" y="411" font-size="18">Internal re-entry or exterior ejection</text><text x="477" y="436" font-size="18">Growth/blister/shock/bridge tests</text><rect x="30" y="325" width="380" height="144" rx="12" fill="#254658" stroke="#82d9ee"/><text x="47" y="355" font-size="22">6. Receiver and release</text><text x="47" y="386" font-size="18">p_obs: fixed area and time response</text><text x="47" y="411" font-size="18">U_j: fixed region/mass/diameter</text><text x="47" y="436" font-size="18">Film/PVC traction → release work</text><path d="M886 397 L845 397" fill="none" stroke="#82d9ee" stroke-width="3" marker-end="url(#dep-arrow)"/><path d="M456 397 L415 397" fill="none" stroke="#82d9ee" stroke-width="3" marker-end="url(#dep-arrow)"/><text x="30" y="525" font-size="21" fill="#ffce8d">All three branches feed geometry, heat loss, phase access and mechanical feedback into this chain.</text><rect x="30" y="560" width="380" height="144" rx="12" fill="#284236" stroke="#82d9ee"/><text x="47" y="590" font-size="22">A. Finite droplet stamp</text><text x="47" y="621" font-size="18">PFC + water; ink/support</text><text x="47" y="646" font-size="18">Free surface, wetting and confinement</text><text x="47" y="671" font-size="18">Track droplet/bubble/filament timing</text><rect x="460" y="560" width="380" height="144" rx="12" fill="#284236" stroke="#82d9ee"/><text x="477" y="590" font-size="22">B. Liquid layer + film/PVC</text><text x="477" y="621" font-size="18">PFC carrier under transferable film</text><text x="477" y="646" font-size="18">Direct impact AND intact-PVC path</text><text x="477" y="671" font-size="18">Supports, contact, vents and release</text><rect x="890" y="560" width="380" height="144" rx="12" fill="#284236" stroke="#82d9ee"/><text x="907" y="590" font-size="22">C. Embedded PFC + hydrogel</text><text x="907" y="621" font-size="18">Bulk cavity, liquid pocket or blister</text><text x="907" y="646" font-size="18">Gel G, K, relaxation, heat, damage</text><text x="907" y="671" font-size="18">Liquid exits and matrix ejecta differ</text><text x="30" y="751" font-size="20">One bubble → 3–5 bubbles → finite arrays → checked continuum: fixed total energy, spacing and delays.</text><rect x="30" y="780" width="1240" height="123" rx="12" fill="#2c3048" stroke="#beb5ff"/><text x="48" y="814" font-size="22">Two separate outputs under declared material, geometry and observation constraints</text><text x="48" y="847" font-size="19">Highest verified single-shot metric: pressure or jet velocity, location, duration, resolution and uncertainty.</text><text x="48" y="878" font-size="19">Repeatable intact-transfer envelope: useful load, placement, satellites, heat/damage, reset and variability.</text><text x="30" y="932" font-size="17">Arrows denote required physical dependencies; this diagram does not show an achieved optimum or a solved model.</text></g></svg>