<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Thermal, jet, boundary and gel diagnostics</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Heating region L_h: α, c_p, ΔT, L_v</text><text x="60" y="155" font-size="18">Carrier/jet speed U or U_j; diameter d_j</text><text x="60" y="184" font-size="18">Liquid: ρ, μ, σ; sound speed c</text><text x="60" y="213" font-size="18">Cavity wall Ṙ; size R_max; boundary h</text><text x="60" y="242" font-size="18">Gel G, relaxation τ_relax; event t_event</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">Pe: advection/diffusion; Ste: sensible/latent</text><text x="575" y="117" font-size="17">We_j: inertia/capillarity; Oh_j: viscous scale</text><text x="575" y="146" font-size="17">M_w, M_j: distinct wall/jet Mach numbers</text><text x="575" y="175" font-size="17">γ: center stand-off/max radius</text><text x="575" y="204" font-size="17">χ_G: gel stiffness/driving-pressure ratio</text><text x="575" y="233" font-size="17">De: relaxation/event-time ratio</text><text x="575" y="262" font-size="17">Δp: stated driving pressure; G: gel shear modulus</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>