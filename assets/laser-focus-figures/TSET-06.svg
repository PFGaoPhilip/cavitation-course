<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Compressible bulk-fluid control volume</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Cell volume: ρ, u, p, e, E</text><text x="60" y="155" font-size="18">Mass and momentum cross cell faces</text><text x="60" y="184" font-size="18">Stress T = −p I + τ acts on faces</text><text x="60" y="213" font-size="18">q conducts heat; Q_abs deposits heat</text><text x="60" y="242" font-size="18">EOS couples p, ρ, e and species fractions</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">e: specific internal energy [J/kg]</text><text x="575" y="117" font-size="17">E: specific total energy [J/kg]</text><text x="575" y="146" font-size="17">τ: viscous stress tensor [Pa]</text><text x="575" y="175" font-size="17">I: identity tensor; ⊗: dyadic product</text><text x="575" y="204" font-size="17">∂_t: time derivative; ∇: spatial derivative</text><text x="575" y="233" font-size="17">Body forces omitted in first control</text><text x="575" y="262" font-size="17">Species transport added for mixtures</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>