<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Bubble equation of state and species</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Cavity volume V_b, temperature T_b</text><text x="60" y="155" font-size="18">Vapor species s: m_v,s and p_v,s</text><text x="60" y="184" font-size="18">Noncondensable component pressure p_g</text><text x="60" y="213" font-size="18">Real-fluid state: density ρ_b, fractions Y_s</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">p_b: total internal pressure [Pa]</text><text x="575" y="117" font-size="17">ℛ_s: species-specific gas constant [J/(kg K)]</text><text x="575" y="146" font-size="17">Y_s: species mass fractions</text><text x="575" y="175" font-size="17">s: water/PFC species index</text><text x="575" y="204" font-size="17">EOS range must cover T, ρ and composition</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>