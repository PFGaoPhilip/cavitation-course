<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><rect x="71" y="115" width="486" height="51" rx="7" fill="#254658" stroke="#82d9ee"/><line x1="581" y1="140" x2="680" y2="140" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="587" y="110" font-size="19" fill="#e8f1f6">U_rms</text><line x1="71" y1="85" x2="557" y2="85" stroke="#82d9ee" stroke-width="3"/><text x="295" y="64" font-size="19" fill="#e8f1f6">L_j</text><line x1="54" y1="115" x2="54" y2="166" stroke="#82d9ee" stroke-width="3"/><text x="18" y="147" font-size="19" fill="#e8f1f6">d_j</text><text x="86" y="198" font-size="19" fill="#e8f1f6">ρ: liquid in the defined jet</text><text x="86" y="231" font-size="19" fill="#e8f1f6">m_j: mass in this cylinder</text><rect x="698" y="76" width="205" height="146" rx="7" fill="#254658" stroke="#82d9ee"/><text x="714" y="108" font-size="19" fill="#e8f1f6">E_j: allocated</text><text x="714" y="138" font-size="19" fill="#e8f1f6">jet energy ceiling</text><text x="714" y="178" font-size="18" fill="#e8f1f6">η_j|B × E_B</text><text x="73" y="291" font-size="17" fill="#e8f1f6">The energy inequality bounds a defined mass-weighted speed, not a vanishing jet tip.</text></g></svg>