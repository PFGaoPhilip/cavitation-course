<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><rect x="82" y="81" width="284" height="145" rx="7" fill="#254658" stroke="#82d9ee"/><text x="104" y="111" font-size="19" fill="#e8f1f6">Heated material h</text><text x="104" y="144" font-size="19" fill="#e8f1f6">ρ_h, c_p,h, k_h</text><text x="104" y="178" font-size="19" fill="#e8f1f6">T(x,t), Q_abs(x,t)</text><circle cx="545" cy="148" r="78" fill="#254658" stroke="#82d9ee" stroke-width="2"/><text x="510" y="144" font-size="19" fill="#e8f1f6">Liquid</text><text x="494" y="175" font-size="19" fill="#e8f1f6">interface T_Γ</text><line x1="365" y1="148" x2="460" y2="148" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="373" y="122" font-size="17" fill="#e8f1f6">heat flux</text><line x1="190" y1="244" x2="318" y2="244" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="222" y="273" font-size="19" fill="#e8f1f6">position x</text><line x1="190" y1="244" x2="190" y2="277" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><line x1="595" y1="208" x2="745" y2="255" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="697" y="282" font-size="17" fill="#e8f1f6">boundary heat loss</text><text x="72" y="39" font-size="19" fill="#e8f1f6">Before significant fluid motion: conduction control</text><text x="74" y="308" font-size="17" fill="#e8f1f6">∇T sets the direction of conduction; Q_abs is a volumetric source, not laser output.</text></g></svg>