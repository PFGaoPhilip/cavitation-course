<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Spherical liquid-inertia control</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Radius R; outward Ṙ and R̈</text><text x="60" y="155" font-size="18">Interior pressure p_b from phase/EOS</text><text x="60" y="184" font-size="18">Ambient liquid: p_∞, ρ, μ</text><text x="60" y="213" font-size="18">Interface: surface tension σ</text><text x="60" y="242" font-size="18">No direction or exterior jet in this control</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">2σ/R: capillary stress [Pa]</text><text x="575" y="117" font-size="17">4μṘ/R: viscous radial stress [Pa]</text><text x="575" y="146" font-size="17">ρ: surrounding-liquid density</text><text x="575" y="175" font-size="17">μ: dynamic viscosity [Pa s]</text><text x="575" y="204" font-size="17">Ṙ: wall speed [m/s]; R̈: acceleration</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>