<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Heat path and timescale control</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Heated region: T(x,t), ρ, c_p, k</text><text x="60" y="155" font-size="18">Fluid motion u transports heat</text><text x="60" y="184" font-size="18">Conduction q crosses material interfaces</text><text x="60" y="213" font-size="18">Source Q_abs lies only in absorber</text><text x="60" y="242" font-size="18">Size L_h; heating interval τ_h</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">α: thermal diffusivity [m²/s]</text><text x="575" y="117" font-size="17">δ_T: thermal penetration scale [m]</text><text x="575" y="146" font-size="17">Fo: dimensionless diffusion comparison</text><text x="575" y="175" font-size="17">x: position; t: time</text><text x="575" y="204" font-size="17">q: conductive heat flux [W/m²]</text><text x="575" y="233" font-size="17">ρ: material density [kg/m³]</text><text x="575" y="262" font-size="17">c_p: heat capacity; k: conductivity</text><text x="575" y="291" font-size="17">u = 0 in the first conduction control</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>