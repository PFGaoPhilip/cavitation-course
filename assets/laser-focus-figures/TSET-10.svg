<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img"><rect width="1100" height="430" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#e8f1f6"><text x="35" y="38" font-size="23">Separated bubbles and interaction distances</text><rect x="42" y="95" width="420" height="230" rx="12" fill="#254658" stroke="#82d9ee"/><text x="60" y="126" font-size="18">Bubble i: R_i, Ṙ_i, R̈_i, p_b,i</text><text x="60" y="155" font-size="18">Neighbor j: R_j, Ṙ_j, R̈_j</text><text x="60" y="184" font-size="18">Center separation d_ij; R/d ≪ 1</text><text x="60" y="213" font-size="18">Shared carrier: ρ, μ; interface σ</text><text x="60" y="242" font-size="18">Ambient p_∞; distinct activation times</text><path d="M470 210 H555 M541 201 L555 210 L541 219" fill="none" stroke="#82d9ee" stroke-width="3"/><text x="575" y="88" font-size="17">i, j: bubble indices; j ≠ i</text><text x="575" y="117" font-size="17">d_ij: center-to-center distance [m]</text><text x="575" y="146" font-size="17">Coupling: neighbor volume acceleration</text><text x="575" y="175" font-size="17">Leading large-separation reference only</text><text x="575" y="204" font-size="17">No shape, collision or jet in this ODE</text><text x="42" y="386" font-size="17">Diagram identifies the control volume, interface or observer; it is not a simulated result.</text></g></svg>