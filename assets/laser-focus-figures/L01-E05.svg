<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#82d9ee"/></marker></defs><rect width="940" height="330" fill="#142330"/><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#e8f1f6"><circle cx="354" cy="155" r="95" fill="#254658" stroke="#82d9ee" stroke-width="2"/><text x="283" y="115" font-size="18" fill="#e8f1f6">p_b = p_g + p_v</text><text x="300" y="148" font-size="19" fill="#e8f1f6">V_b, T_b, U_b</text><text x="305" y="181" font-size="19" fill="#e8f1f6">m_v, R_v</text><line x1="354" y1="207" x2="436" y2="207" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="359" y="237" font-size="19" fill="#e8f1f6">R, Ṙ</text><line x1="170" y1="148" x2="252" y2="148" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="77" y="137" font-size="19" fill="#e8f1f6">Q̇_b: heat in</text><text x="45" y="248" font-size="16" fill="#e8f1f6">h_v ṁ_v: mass enthalpy in</text><line x1="165" y1="215" x2="266" y2="188" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><line x1="449" y1="148" x2="592" y2="148" stroke="#82d9ee" stroke-width="3" marker-end="url(#a)"/><text x="486" y="80" font-size="17" fill="#e8f1f6">p_b V̇_b: work out</text><text x="620" y="134" font-size="19" fill="#e8f1f6">V̇_b = 4πR²Ṙ</text><text x="620" y="176" font-size="19" fill="#e8f1f6">R_v: vapor gas constant</text><text x="620" y="216" font-size="17" fill="#e8f1f6">Ideal vapor: reference only</text><text x="73" y="292" font-size="18" fill="#e8f1f6">Thermal energy, mass and volume evolve together; pressure needs an EOS.</text></g></svg>